<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>現場写真 電子黒板カメラ (GitHub Pages版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #020617;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const STAGE_OPTIONS = [
      { id: '施工前', label: '施工前' },
      { id: '施工中', label: '施工中' },
      { id: '施工完了', label: '施工完了' },
      { id: '材料・機材', label: '材料・機材' },
      { id: '産業廃棄物', label: '産廃・発生材' },
      { id: '自主検査', label: '自主検査' },
    ];

    function MobileCameraApp() {
      const [activeTab, setActiveTab] = useState('camera');
      const [isStreaming, setIsStreaming] = useState(false);
      const [streamError, setStreamError] = useState(null);
      const [facingMode, setFacingMode] = useState('environment');
      const [isUploading, setIsUploading] = useState(false);
      const [uploadSuccessAlert, setUploadSuccessAlert] = useState(null);

      // URLパラメータから工事情報とGASのURLを取得
      const [urlConfig, setUrlConfig] = useState({
        gasUrl: '',
        recordId: '',
        projectCode: '',
        projectName: '',
        contractor: '',
        location: '',
        manager: ''
      });

      // 電子黒板データ
      const [blackboard, setBlackboard] = useState({
        projectName: '整備・工事記録写真',
        workCategory: '外構・舗装工事 / インターロッキングブロック敷設',
        location: '1F エントランス前 西側歩道',
        spec: '不陸: L=3.5m, 段差=25mm',
        stage: '施工中',
        inspector: '現場代理人',
        contractor: '',
        notes: '同一アングル撮影確認良好',
        date: new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }),
        style: 'green',
        scale: 0.38,
        opacity: 1.0,
        position: 'bottom-right'
      });

      const [recentPhotos, setRecentPhotos] = useState(() => {
        try {
          const s = localStorage.getItem('GH_PHOTO_HISTORY');
          if (s) return JSON.parse(s);
        } catch (e) {}
        return [];
      });

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const animFrameRef = useRef(null);

      // 初期化：URLパラメータ取得
      useEffect(() => {
        const p = new URLSearchParams(window.location.search);
        let gasUrl = p.get('gasUrl') || '';
        if (gasUrl.includes('%')) {
          try { gasUrl = decodeURIComponent(gasUrl); } catch(e){}
        }
        const recordId = p.get('recordId') || '';
        const projectCode = p.get('projectCode') || '';
        const projectName = p.get('projectName') || '';
        const contractor = p.get('contractor') || '';
        const location = p.get('location') || '';
        const manager = p.get('manager') || '';

        setUrlConfig({ gasUrl, recordId, projectCode, projectName, contractor, location, manager });

        setBlackboard(prev => ({
          ...prev,
          projectName: projectName || prev.projectName,
          contractor: contractor || prev.contractor,
          location: location || prev.location,
          inspector: manager || prev.inspector
        }));
      }, []);

// カメラ起動（会社携帯・ミドルレンジ端末ハングアップ完全回避版）
      const startCamera = async (targetFacing = facingMode) => {
        setStreamError(null);

        if (streamRef.current) {
          try {
            streamRef.current.getTracks().forEach(t => t.stop());
          } catch(e) {}
          streamRef.current = null;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStreamError('ブラウザがカメラ機能に対応していません。');
          return;
        }

        // 端末によってフリーズしないよう、柔軟な制約順で試行
        const tryConstraints = [
          // ① 最も安全：解像度の数値を固定せず、端末ネイティブの背面カメラを要求（会社Android対応）
          { video: { facingMode: targetFacing }, audio: false },
          // ② HD理想指定（Pixel等で高品質になる設定）
          { video: { facingMode: { ideal: targetFacing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
          // ③ 全制約解除（最後の砦）
          { video: true, audio: false }
        ];

        let activeStream = null;
        for (const constraints of tryConstraints) {
          try {
            // 3秒以上反応がない場合は強制タイムアウトして次へ行く安全装置
            activeStream = await Promise.race([
              navigator.mediaDevices.getUserMedia(constraints),
              new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 3000))
            ]);
            if (activeStream) break;
          } catch (err) {
            console.warn('カメラ試行スキップ:', err);
          }
        }

        if (!activeStream) {
          setStreamError('カメラの起動がタイムアウトしました。');
          setIsStreaming(false);
          return;
        }

        streamRef.current = activeStream;
        const video = videoRef.current;
        if (video) {
          video.srcObject = activeStream;
          video.setAttribute('playsinline', 'true');
          video.setAttribute('webkit-playsinline', 'true');
          video.setAttribute('muted', 'true');
          video.muted = true;

          try {
            await video.play();
            setIsStreaming(true);
            setStreamError(null);
          } catch (playErr) {
            console.warn('playエラー強制復元:', playErr);
            setIsStreaming(true);
          }
        }
      };

      // 自動起動
      useEffect(() => {
        startCamera(facingMode);
        return () => {
          if (streamRef.current) {
            streamRef.current.getTracks().forEach(t => t.stop());
          }
        };
      }, [facingMode]);

      const handleToggleFacing = () => {
        const next = facingMode === 'environment' ? 'user' : 'environment';
        setFacingMode(next);
        startCamera(next);
      };

      // 文字調整
      const drawFittedText = (ctx, text, x, y, maxWidth, baseFontSize, color, align = 'left') => {
        if (!text) return;
        ctx.save();
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        let fontSize = baseFontSize;
        ctx.font = `bold ${fontSize}px sans-serif`;
        while (ctx.measureText(text).width > maxWidth && fontSize > 8) {
          fontSize -= 0.5;
          ctx.font = `bold ${fontSize}px sans-serif`;
        }
        let txt = text;
        if (ctx.measureText(txt).width > maxWidth) {
          while (txt.length > 1 && ctx.measureText(txt + '…').width > maxWidth) {
            txt = txt.slice(0, -1);
          }
          txt += '…';
        }
        ctx.fillText(txt, x, y);
        ctx.restore();
      };

      // 電子黒板描画
      const renderBlackboard = useCallback((ctx, w, h) => {
        const boardW = Math.round(w * blackboard.scale);
        const boardH = Math.round(boardW * 0.70);
        const margin = 20;

        let bx = w - boardW - margin;
        let by = h - boardH - margin;
        if (blackboard.position === 'bottom-left') { bx = margin; by = h - boardH - margin; }
        else if (blackboard.position === 'top-right') { bx = w - boardW - margin; by = margin; }
        else if (blackboard.position === 'top-left') { bx = margin; by = margin; }

        ctx.save();
        ctx.globalAlpha = blackboard.opacity;

        const bw = 6;
        ctx.fillStyle = '#3d1f08';
        ctx.fillRect(bx, by, boardW, boardH);
        ctx.fillStyle = '#784212';
        ctx.fillRect(bx + 1, by + 1, boardW - 2, 2);
        ctx.fillRect(bx + 1, by + 1, 2, boardH - 2);

        const innerX = bx + bw;
        const innerY = by + bw;
        const innerW = boardW - bw * 2;
        const innerH = boardH - bw * 2;

        ctx.fillStyle = '#0d3822';
        ctx.fillRect(innerX, innerY, innerW, innerH);

        const rowCount = 8;
        const rowH = innerH / rowCount;
        const col1W = Math.round(innerW * 0.28);
        const col2W = innerW - col1W;

        ctx.fillStyle = 'rgba(7, 28, 17, 0.45)';
        ctx.fillRect(innerX, innerY, col1W, innerH);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 1;
        for (let i = 1; i < rowCount; i++) {
          ctx.beginPath();
          ctx.moveTo(innerX, innerY + i * rowH);
          ctx.lineTo(innerX + innerW, innerY + i * rowH);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(innerX + col1W, innerY);
        ctx.lineTo(innerX + col1W, innerY + innerH);
        ctx.stroke();

        const rows = [
          ['① 件名', blackboard.projectName || '未設定', '#fef08a'],
          ['② 作業種目', blackboard.workCategory || '-', '#ffffff'],
          ['③ 撮影部位', blackboard.location || '-', '#ffffff'],
          ['④ 寸法・規格', blackboard.spec || '-', '#fef9c3'],
          ['⑤ 撮影時期', blackboard.date || '-', '#93c5fd'],
          ['⑥ 施工状況', blackboard.stage || '-', '#fcd34d'],
          ['⑦ 施工者名', blackboard.contractor || '未設定', '#6ee7b7'],
          ['⑧ 特記事項', blackboard.notes || '-', '#a7f3d0']
        ];

        rows.forEach(([lbl, val, col], idx) => {
          const ry = innerY + idx * rowH + rowH / 2;
          drawFittedText(ctx, lbl, innerX + col1W / 2, ry, col1W - 6, Math.max(10, Math.round(rowH * 0.38)), 'rgba(255, 255, 255, 0.95)', 'center');

          if (idx === 5) {
            const stageName = val || '施工中';
            let badgeBg = '#b45309';
            if (stageName.includes('前')) badgeBg = '#1d4ed8';
            else if (stageName.includes('完')) badgeBg = '#047857';
            else if (stageName.includes('材料')) badgeBg = '#6d28d9';
            else if (stageName.includes('廃棄')) badgeBg = '#be123c';
            else if (stageName.includes('検査')) badgeBg = '#0e7490';

            const pillH = Math.round(rowH * 0.72);
            const pillW = Math.min(col2W - 16, Math.max(76, Math.round(ctx.measureText(stageName).width + 24)));
            const pillX = innerX + col1W + 8;
            const pillY = ry - pillH / 2;

            ctx.fillStyle = badgeBg;
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(pillX, pillY, pillW, pillH, pillH / 2) : ctx.rect(pillX, pillY, pillW, pillH);
            ctx.fill();

            drawFittedText(ctx, stageName, pillX + pillW / 2, ry, pillW - 8, Math.max(10, Math.round(rowH * 0.40)), '#ffffff', 'center');
          } else {
            drawFittedText(ctx, val, innerX + col1W + 8, ry, col2W - 14, Math.max(10, Math.round(rowH * 0.38)), col, 'left');
          }
        });

        ctx.restore();
      }, [blackboard]);

      // リアルタイム描画ループ
      useEffect(() => {
        const renderLoop = () => {
          const canvas = canvasRef.current;
          const video = videoRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const w = 1280;
          const h = 720;
          if (canvas.width !== w) canvas.width = w;
          if (canvas.height !== h) canvas.height = h;

          ctx.clearRect(0, 0, w, h);

          const isVideoActive = !!(video && video.srcObject && (video.readyState >= 2 || video.currentTime > 0));

          if (isVideoActive) {
            try {
              if (facingMode === 'user') {
                ctx.save();
                ctx.translate(w, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, w, h);
                ctx.restore();
              } else {
                ctx.drawImage(video, 0, 0, w, h);
              }
            } catch(e) {}
          } else {
            const grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#020617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
          }

          renderBlackboard(ctx, w, h);

          animFrameRef.current = requestAnimationFrame(renderLoop);
        };

        animFrameRef.current = requestAnimationFrame(renderLoop);
        return () => {
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        };
      }, [isStreaming, facingMode, renderBlackboard]);

      // シャッター撮影 ＆ GAS経由でkintoneへPOST送信
      const handleShutter = async () => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

        const photoRecord = {
          id: 'photo_' + Date.now(),
          url: dataUrl,
          stage: blackboard.stage,
          workCategory: blackboard.workCategory,
          location: blackboard.location,
          capturedAt: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
        };

        const updated = [photoRecord, ...recentPhotos];
        setRecentPhotos(updated);
        try {
          localStorage.setItem('GH_PHOTO_HISTORY', JSON.stringify(updated));
        } catch(e) {}

        // GASへの送信
        if (urlConfig.gasUrl) {
          setIsUploading(true);
          try {
            const payload = {
              action: "uploadCapturedPhoto",
              recordId: urlConfig.recordId,
              photoData: {
                photoNo: Date.now(),
                projectCode: urlConfig.projectCode,
                base64Image: dataUrl,
                stage: blackboard.stage,
                workCategory: blackboard.workCategory,
                location: blackboard.location,
                spec: blackboard.spec,
                projectName: blackboard.projectName,
                contractor: blackboard.contractor,
                notes: blackboard.notes,
                date: blackboard.date
              }
            };

            await fetch(urlConfig.gasUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify(payload),
              mode: 'no-cors'
            });

            setIsUploading(false);
            setUploadSuccessAlert('✅ 撮影完了！黒板付き写真をkintoneへ送信しました');
            setTimeout(() => setUploadSuccessAlert(null), 4000);
          } catch(err) {
            console.error(err);
            setIsUploading(false);
            alert('送信に失敗しました: ' + err.message);
          }
        } else {
          setUploadSuccessAlert('✅ 撮影完了！（端末に保存しました）');
          setTimeout(() => setUploadSuccessAlert(null), 3000);
        }
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col justify-between pb-6">
          <header className="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-3.5 py-2.5 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className={`w-2.5 h-2.5 rounded-full ${isStreaming ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
              <span className="text-xs font-black text-white tracking-wide">現場写真 電子黒板カメラ</span>
            </div>
            <span className="text-[10px] font-mono font-bold bg-amber-950/80 text-amber-300 px-2 py-0.5 rounded border border-amber-800/80">
              {urlConfig.projectCode ? `[${urlConfig.projectCode}]` : 'GitHub Pages版'}
            </span>
          </header>

          <div className="bg-slate-900/80 border-b border-slate-800 px-2 py-1.5 flex items-center justify-around text-xs font-bold">
            <button
              onClick={() => setActiveTab('camera')}
              className={`flex-1 py-1.5 text-center rounded-lg transition ${activeTab === 'camera' ? 'bg-amber-500 text-slate-950 font-black shadow' : 'text-slate-400'}`}
            >
              📷 撮影
            </button>
            <button
              onClick={() => setActiveTab('board')}
              className={`flex-1 py-1.5 text-center rounded-lg transition ${activeTab === 'board' ? 'bg-amber-500 text-slate-950 font-black shadow' : 'text-slate-400'}`}
            >
              📋 黒板設定
            </button>
            <button
              onClick={() => setActiveTab('history')}
              className={`flex-1 py-1.5 text-center rounded-lg transition ${activeTab === 'history' ? 'bg-amber-500 text-slate-950 font-black shadow' : 'text-slate-400'}`}
            >
              🖼️ 撮影済み ({recentPhotos.length})
            </button>
          </div>

          {uploadSuccessAlert && (
            <div className="mx-3 mt-2 bg-emerald-950/90 border border-emerald-500/80 text-emerald-200 text-xs p-2.5 rounded-xl shadow-lg">
              {uploadSuccessAlert}
            </div>
          )}

          <main className="flex-1 p-3 space-y-3">
            {activeTab === 'camera' && (
              <div className="space-y-3">
                <div className="relative bg-black rounded-2xl overflow-hidden border-2 border-slate-800 w-full aspect-[4/3] flex items-center justify-center shadow-2xl">
                  <video
                    ref={videoRef}
                    playsInline
                    webkit-playsinline="true"
                    muted
                    autoPlay
                    className="absolute inset-0 w-full h-full object-cover hidden"
                  />
                  <canvas ref={canvasRef} className="w-full h-full object-contain pointer-events-none" />

                  {isStreaming && (
                    <div className="absolute top-2 left-2 z-20 flex items-center gap-1.5 bg-slate-900/85 px-2.5 py-1 rounded-lg border border-emerald-500/60 shadow">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                      <span className="text-[10px] text-emerald-300 font-bold">🟢 画角内黒板プレビュー中</span>
                    </div>
                  )}

                  {!isStreaming && (
                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/85 p-4 text-center z-20 space-y-3">
                      {streamError ? (
                        <p className="text-xs text-rose-300">{streamError}</p>
                      ) : (
                        <p className="text-xs text-amber-300 font-bold">カメラ起動中...</p>
                      )}
                      <button
                        type="button"
                        onClick={() => startCamera(facingMode)}
                        className="bg-amber-500 text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs"
                      >
                        📷 カメラを起動する
                      </button>
                    </div>
                  )}

                  {isStreaming && (
                    <button
                      type="button"
                      onClick={handleToggleFacing}
                      className="absolute top-2 right-2 z-20 px-2 py-1 rounded-lg text-[10px] font-bold bg-slate-900/80 text-slate-200 border border-slate-700 backdrop-blur-md"
                    >
                      🔄 反転
                    </button>
                  )}
                </div>

                <button
                  type="button"
                  disabled={isUploading}
                  onClick={handleShutter}
                  className="w-full bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 hover:from-amber-400 text-slate-950 font-black py-4 rounded-2xl text-base flex items-center justify-center gap-2 shadow-2xl shadow-amber-500/30 active:scale-95 transition-all cursor-pointer border border-amber-300"
                >
                  {isUploading ? <span>⏳ kintone 送信中...</span> : <span>📸 シャッター（kintoneへ送信）</span>}
                </button>
              </div>
            )}

            {activeTab === 'board' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 text-xs">
                <span className="font-bold text-amber-400 text-sm block border-b border-slate-800 pb-2">📋 黒板設定</span>
                <div>
                  <label className="text-slate-400 block text-[10px] mb-0.5">① 工事件名</label>
                  <input
                    type="text"
                    value={blackboard.projectName}
                    onChange={(e) => setBlackboard({ ...blackboard, projectName: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-white"
                  />
                </div>
                <div>
                  <label className="text-slate-400 block text-[10px] mb-0.5">② 作業種目</label>
                  <input
                    type="text"
                    value={blackboard.workCategory}
                    onChange={(e) => setBlackboard({ ...blackboard, workCategory: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-white"
                  />
                </div>
                <div>
                  <label className="text-slate-400 block text-[10px] mb-0.5">③ 撮影部位</label>
                  <input
                    type="text"
                    value={blackboard.location}
                    onChange={(e) => setBlackboard({ ...blackboard, location: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-white"
                  />
                </div>
                <div>
                  <label className="text-slate-400 block text-[10px] mb-0.5">④ 寸法・規格</label>
                  <input
                    type="text"
                    value={blackboard.spec}
                    onChange={(e) => setBlackboard({ ...blackboard, spec: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-white"
                  />
                </div>
                <div>
                  <label className="text-slate-400 block text-[10px] mb-1">⑥ 施工状況</label>
                  <div className="grid grid-cols-3 gap-1">
                    {STAGE_OPTIONS.map(st => (
                      <button
                        key={st.id}
                        type="button"
                        onClick={() => setBlackboard({ ...blackboard, stage: st.id })}
                        className={`py-1.5 rounded font-bold ${blackboard.stage === st.id ? 'bg-amber-500 text-slate-950' : 'bg-slate-950 text-slate-300'}`}
                      >
                        {st.id}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <label className="text-slate-400 block text-[10px] mb-0.5">⑦ 施工者名</label>
                  <input
                    type="text"
                    value={blackboard.contractor}
                    onChange={(e) => setBlackboard({ ...blackboard, contractor: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-white"
                  />
                </div>
                <div>
                  <label className="text-slate-400 block text-[10px] mb-0.5">⑧ 特記事項</label>
                  <input
                    type="text"
                    value={blackboard.notes}
                    onChange={(e) => setBlackboard({ ...blackboard, notes: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded p-1.5 text-white"
                  />
                </div>
                <button
                  type="button"
                  onClick={() => setActiveTab('camera')}
                  className="w-full bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl mt-2"
                >
                  撮影画面へ戻る ➔
                </button>
              </div>
            )}

            {activeTab === 'history' && (
              <div className="space-y-3">
                <span className="text-xs font-bold text-white block">撮影済み ({recentPhotos.length}枚)</span>
                <div className="grid grid-cols-2 gap-2">
                  {recentPhotos.map(p => (
                    <div key={p.id} className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden p-1">
                      <img src={p.url} alt="写真" className="w-full aspect-[4/3] object-cover rounded" />
                      <div className="p-1 text-[10px]">
                        <span className="text-amber-400 font-bold">{p.stage}</span>
                        <p className="text-slate-300 truncate">{p.workCategory}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<MobileCameraApp />, document.getElementById('root'));
  </script>
</body>
</html>
