    function MobileCameraApp() {
      const [activeTab, setActiveTab] = useState('board');
      const [isStreaming, setIsStreaming] = useState(false);
      const [streamError, setStreamError] = useState(null);
      const [facingMode, setFacingMode] = useState('environment');
      const [isUploading, setIsUploading] = useState(false);
      const [uploadSuccessAlert, setUploadSuccessAlert] = useState(null);
      const [isTorchOn, setIsTorchOn] = useState(false); // ライト点灯状態
      const [zoomLevel, setZoomLevel] = useState(1.0); // ズーム倍率
      const [showBoardControls, setShowBoardControls] = useState(false); // 撮影画面での黒板設定パネル開閉

      // 撮影心得モーダルの開閉ステート
      const [showTipsModal, setShowTipsModal] = useState(false);
      const [dontShowTipsAgain, setDontShowTipsAgain] = useState(false);

      // 撮影向き設定（永続化）
      const [photoOrientation, setPhotoOrientation] = useState(() => {
        try {
          const pref = localStorage.getItem(PREFS_STORAGE_KEY);
          if (pref) {
            const p = JSON.parse(pref);
            if (p.photoOrientation) return p.photoOrientation;
          }
        } catch (e) {}
        return 'landscape';
      });

      const [urlConfig, setUrlConfig] = useState({
        gasUrl: '',
        recordId: '',
        projectCode: ''
      });

      // 黒板初期値（端末ローカル保持 + デフォルト値）
      const [blackboard, setBlackboard] = useState(() => {
        let base = {
          projectName: '工事記録写真',
          section: '建築工事編',               // ★最初の大分類
          workType29: 'コンクリート工事',     // ★絞り込まれた工事種目
          workDetail: '型枠組立状況',         // ★中項目（自由記入）
          location: '1階 スラブ',
          stage: '施工中',
          stageDetail: '',
          specAndNotes: '',
          constractor: '施工会社',
          date: getSystemDateYmd(),
          theme: 'green',
          scale: 0.44,
          opacity: 1.0,
          position: 'bottom-right'
        };

        try {
          const pref = localStorage.getItem(PREFS_STORAGE_KEY);
          if (pref) {
            const p = JSON.parse(pref);
            if (p.theme) base.theme = p.theme;
            if (p.scale) base.scale = p.scale;
            if (p.opacity) base.opacity = p.opacity;
            if (p.position) base.position = p.position;
          }
        } catch (e) {}

        return base;
      });

      // 撮影履歴（現在の工事案件に紐づく写真リスト）
      const [recentPhotos, setRecentPhotos] = useState([]);
      // 履歴一覧からタップした写真の詳細確認モーダル用
      const [selectedPhotoModal, setSelectedPhotoModal] = useState(null);

      // 撮影直後の確認プレビュー用の一時写真データ（撮り直し or 送信選択用）
      const [pendingPhoto, setPendingPhoto] = useState(null);

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const animFrameRef = useRef(null);

      // 初回起動時のURL解析および設定復元
      useEffect(() => {
        try {
          const p = new URLSearchParams(window.location.search);
          const gasUrl = p.get('gasUrl') || '';
          const recordId = p.get('recordId') || '';
          const projectCode = p.get('projectCode') || '';

          setUrlConfig({ gasUrl, recordId, projectCode });

          // 初回訪問チェック：まだ心得を非表示にしていない場合は自動で心得モーダルを開く
          const dismissed = localStorage.getItem(TIPS_DISMISSED_KEY);
          if (!dismissed) {
            setShowTipsModal(true);
          }

          // 1. 案件専用履歴の読み込み
          const hKey = getHistoryStorageKey(projectCode);
          const savedHistory = localStorage.getItem(hKey);
          if (savedHistory) {
            try { setRecentPhotos(JSON.parse(savedHistory)); } catch (e) {}
          } else {
            setRecentPhotos([]);
          }

          // 2. 案件専用黒板設定の復元（ブラウザ再起動時のリセット防止）
          const sKey = getSettingsStorageKey(projectCode);
          const savedSettings = localStorage.getItem(sKey);
          let loadedSettings = {};
          if (savedSettings) {
            try { loadedSettings = JSON.parse(savedSettings); } catch (e) {}
          }

          const pName = p.get('projectName');
          const cName = p.get('constractor') || p.get('contractor');
          const loc = p.get('location');

          setBlackboard(prev => {
            const merged = {
              ...prev,
              ...loadedSettings,
              date: getSystemDateYmd()
            };
            if (pName && !loadedSettings.projectName) merged.projectName = decodeURIComponent(pName);
            if (cName && !loadedSettings.constractor) merged.constractor = decodeURIComponent(cName);
            if (loc && !loadedSettings.location) merged.location = decodeURIComponent(loc);
            return merged;
          });

          // kintone詳細取得による最新マスタ補完
          if (gasUrl && recordId) {
            fetch(gasUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({ action: 'getProjectDetail', recordId: recordId })
            })
            .then(res => res.json())
            .then(data => {
              if (data && data.record) {
                const rec = data.record;
                setBlackboard(prev => {
                  const updated = {
                    ...prev,
                    projectName: rec.ProjectName?.value || prev.projectName,
                    constractor: rec.ConstractorName?.value || prev.constractor,
                    location: prev.location || rec.WorkLocation?.value || '',
                    date: getSystemDateYmd()
                  };
                  return updated;
                });
              }
            })
            .catch(() => {});
          }
        } catch (e) {}
      }, []);

      // 黒板設定・入力内容が変更されたらローカルストレージへ即時自動保存
      useEffect(() => {
        try {
          const sKey = getSettingsStorageKey(urlConfig.projectCode);
          localStorage.setItem(sKey, JSON.stringify(blackboard));

          const prefs = {
            theme: blackboard.theme,
            scale: blackboard.scale,
            opacity: blackboard.opacity,
            position: blackboard.position,
            photoOrientation: photoOrientation
          };
          localStorage.setItem(PREFS_STORAGE_KEY, JSON.stringify(prefs));
        } catch (e) {}
      }, [blackboard, photoOrientation, urlConfig.projectCode]);

      const handleCloseTipsModal = () => {
        if (dontShowTipsAgain) {
          try {
            localStorage.setItem(TIPS_DISMISSED_KEY, 'true');
          } catch (e) {}
        }
        setShowTipsModal(false);
      };

      const startCamera = async (targetFacing = facingMode) => {
        setStreamError(null);
        if (streamRef.current) {
          try { streamRef.current.getTracks().forEach(t => t.stop()); } catch(e) {}
          streamRef.current = null;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStreamError('カメラ機能に対応していません');
          return;
        }

        const tryConstraints = [
          { video: { facingMode: targetFacing }, audio: false },
          { video: { facingMode: { ideal: targetFacing } }, audio: false },
          { video: true, audio: false }
        ];

        let activeStream = null;
        for (const constraints of tryConstraints) {
          try {
            activeStream = await navigator.mediaDevices.getUserMedia(constraints);
            if (activeStream) break;
          } catch (err) {}
        }

        if (!activeStream) {
          setStreamError('カメラを起動できませんでした。アクセス許可を確認してください');
          setIsStreaming(false);
          return;
        }

        streamRef.current = activeStream;
        const video = videoRef.current;
        if (video) {
          video.srcObject = activeStream;
          video.setAttribute('playsinline', 'true');
          video.setAttribute('webkit-playsinline', 'true');
          video.muted = true;
          try {
            await video.play();
            setIsStreaming(true);
            setStreamError(null);
          } catch (e) {
            setIsStreaming(true);
          }
        }
      };

      useEffect(() => {
        if (activeTab === 'camera') {
          startCamera(facingMode);
        }
        return () => {
          if (streamRef.current) {
            try { streamRef.current.getTracks().forEach(t => t.stop()); } catch(e){}
          }
        };
      }, [facingMode, activeTab]);

      const handleToggleFacing = () => {
        const next = facingMode === 'environment' ? 'user' : 'environment';
        setFacingMode(next);
      };
      
      // ライト（トーチ）点灯切替関数
      const handleToggleTorch = async () => {
        if (!streamRef.current) return;
        const track = streamRef.current.getVideoTracks()[0];
        if (!track) return;
        try {
          const nextState = !isTorchOn;
          await track.applyConstraints({
            advanced: [{ torch: nextState }]
          });
          setIsTorchOn(nextState);
        } catch (e) {
          alert("この端末・ブラウザはライト制御に対応していません");
        }
      };

      // ズーム切替関数（1.0x -> 1.5x -> 2.0x -> 1.0x）
      const handleCycleZoom = async () => {
        const nextZoom = zoomLevel === 1.0 ? 1.5 : (zoomLevel === 1.5 ? 2.0 : 1.0);
        setZoomLevel(nextZoom);

        // ハードウェアズーム対応端末への適用
        if (streamRef.current) {
          const track = streamRef.current.getVideoTracks()[0];
          if (track && track.getCapabilities) {
            const caps = track.getCapabilities();
            if (caps.zoom) {
              try {
                await track.applyConstraints({
                  advanced: [{ zoom: nextZoom }]
                });
              } catch(err) {}
            }
          }
        }
      };
      
      const drawFittedText = (ctx, text, x, y, maxWidth, baseFontSize, color, align = 'left') => {
        if (!text) return;
        ctx.save();
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        let fontSize = baseFontSize;
        ctx.font = `bold ${fontSize}px "Noto Sans JP", sans-serif`;
        while (ctx.measureText(text).width > maxWidth && fontSize > 7) {
          fontSize -= 0.5;
          ctx.font = `bold ${fontSize}px "Noto Sans JP", sans-serif`;
        }
        let txt = text;
        if (ctx.measureText(txt).width > maxWidth) {
          while (txt.length > 1 && ctx.measureText(txt + '…').width > maxWidth) {
            txt = txt.slice(0, -1);
          }
          txt += '…';
        }
        ctx.fillText(txt, x, y);
        ctx.restore();
      };

      // 特記事項用：最大3行まで美しく折り返し・表示する描画関数
      const drawThreeLineText = (ctx, text, x, startY, maxWidth, lineHeight, baseFontSize, color) => {
        if (!text) return;
        ctx.save();
        ctx.fillStyle = color;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';

        let fontSize = baseFontSize;
        ctx.font = `bold ${fontSize}px "Noto Sans JP", sans-serif`;

        const rawLines = String(text).split('\n');
        let processedLines = [];

        for (let i = 0; i < rawLines.length; i++) {
          let line = rawLines[i];
          if (!line) {
            if (processedLines.length < 3) processedLines.push('');
            continue;
          }

          while (line.length > 0) {
            if (ctx.measureText(line).width <= maxWidth) {
              processedLines.push(line);
              break;
            } else {
              let cutIndex = line.length - 1;
              while (cutIndex > 1 && ctx.measureText(line.slice(0, cutIndex)).width > maxWidth) {
                cutIndex--;
              }
              processedLines.push(line.slice(0, cutIndex));
              line = line.slice(cutIndex);
            }
          }
        }

        const linesToDraw = processedLines.slice(0, 3);

        if (processedLines.length > 3) {
          let lastLine = linesToDraw[2] || '';
          while (lastLine.length > 1 && ctx.measureText(lastLine + '…').width > maxWidth) {
            lastLine = lastLine.slice(0, -1);
          }
          linesToDraw[2] = lastLine + '…';
        }

        linesToDraw.forEach((lineStr, lineIdx) => {
          let lineY = startY + (lineIdx * lineHeight);
          ctx.fillText(lineStr, x, lineY);
        });

        ctx.restore();
      };

      const renderBlackboard = useCallback((ctx, w, h) => {
        const boardW = Math.round(w * blackboard.scale);
        const boardH = Math.round(boardW * 0.70);
        const margin = 16;

        let bx = w - boardW - margin;
        let by = h - boardH - margin;
        if (blackboard.position === 'bottom-left') { bx = margin; by = h - boardH - margin; }
        else if (blackboard.position === 'top-right') { bx = w - boardW - margin; by = margin; }
        else if (blackboard.position === 'top-left') { bx = margin; by = margin; }

        ctx.save();
        ctx.globalAlpha = blackboard.opacity;

        let frameColor = '#3d1f08';
        let innerBg = '#0d3822';
        let textMain = '#ffffff';
        let textSub = '#fef08a';
        let lineCol = 'rgba(255, 255, 255, 0.4)';

        if (blackboard.theme === 'black') {
          frameColor = '#18181b';
          innerBg = '#09090b';
          textMain = '#f4f4f5';
          textSub = '#fde047';
          lineCol = 'rgba(255, 255, 255, 0.3)';
        } else if (blackboard.theme === 'white') {
          frameColor = '#94a3b8';
          innerBg = '#ffffff';
          textMain = '#0f172a';
          textSub = '#0369a1';
          lineCol = 'rgba(15, 23, 42, 0.3)';
        }

        const bw = 5;
        ctx.fillStyle = frameColor;
        ctx.fillRect(bx, by, boardW, boardH);

        const innerX = bx + bw;
        const innerY = by + bw;
        const innerW = boardW - bw * 2;
        const innerH = boardH - bw * 2;

        ctx.fillStyle = innerBg;
        ctx.fillRect(innerX, innerY, innerW, innerH);

        const row1H = innerH * 0.15;
        const row2H = innerH * 0.15;
        const bottomH = innerH * 0.14;
        const midH = innerH - (row1H + row2H + bottomH);

        const colLabelW = Math.round(innerW * 0.23);

        // 1行目の横線
        ctx.strokeStyle = lineCol;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(innerX, innerY + row1H);
        ctx.lineTo(innerX + innerW, innerY + row1H);
        ctx.stroke();

        // 1・2行目の縦区切り線
        ctx.beginPath();
        ctx.moveTo(innerX + colLabelW, innerY);
        ctx.lineTo(innerX + colLabelW, innerY + row1H * 2);
        ctx.stroke();

        // ★ 1行目: 工事名（復元）
        drawFittedText(ctx, "工事名", innerX + colLabelW / 2, innerY + row1H / 2, colLabelW - 6, Math.round(row1H * 0.40), textMain, 'center');
        drawFittedText(ctx, blackboard.projectName || '', innerX + colLabelW + 8, innerY + row1H / 2, innerW - colLabelW - 14, Math.round(row1H * 0.40), textSub, 'left');

        // 2行目の横線
        ctx.beginPath();
        ctx.moveTo(innerX, innerY + row1H + row2H);
        ctx.lineTo(innerX + innerW, innerY + row1H + row2H);
        ctx.stroke();

        // ★ 2行目: 工種（変数名 fullCategory に正しく統一）
        const cleanType = (blackboard.workType29 || '').replace(/^\d+\.\s*/, '');
        const fullCategory = blackboard.workDetail 
          ? `${cleanType} / ${blackboard.workDetail}` 
          : cleanType;

        drawFittedText(ctx, "工 種", innerX + colLabelW / 2, innerY + row1H + row2H / 2, colLabelW - 6, Math.round(row2H * 0.40), textMain, 'center');
        drawFittedText(ctx, fullCategory, innerX + colLabelW + 8, innerY + row1H + row2H / 2, innerW - colLabelW - 14, Math.round(row2H * 0.40), textMain, 'left');

        // 中間部（撮影部位、施工状況、特記事項）
        const midStartY = innerY + row1H + row2H;
        const locH = midH * 0.22;
        const stgH = midH * 0.22;
        const notesTotalH = midH - (locH + stgH);
        const notesLineH = notesTotalH / 3;

        // 撮影部位
        const locY = midStartY + locH * 0.5;
        drawFittedText(ctx, "撮影部位:", innerX + 8, locY, colLabelW - 6, Math.round(locH * 0.44), textMain, 'left');
        drawFittedText(ctx, blackboard.location || '-', innerX + colLabelW + 4, locY, innerW - colLabelW - 10, Math.round(locH * 0.44), textMain, 'left');

        // 施工状況
        const stgY = midStartY + locH + stgH * 0.5;
        drawFittedText(ctx, "施工状況:", innerX + 8, stgY, colLabelW - 6, Math.round(stgH * 0.44), textMain, 'left');
        const stageText = `${blackboard.stage || '施工中'}${blackboard.stageDetail ? ' (' + blackboard.stageDetail + ')' : ''}`;
        drawFittedText(ctx, stageText, innerX + colLabelW + 4, stgY, innerW - colLabelW - 10, Math.round(stgH * 0.44), textSub, 'left');

        // 特記事項
        const notesStartY = midStartY + locH + stgH;
        const notesLabelY = notesStartY + notesLineH * 0.5;
        drawFittedText(ctx, "特記事項:", innerX + 8, notesLabelY, colLabelW - 6, Math.round(notesLineH * 0.44), textMain, 'left');

        drawThreeLineText(
          ctx,
          blackboard.specAndNotes || '-',
          innerX + colLabelW + 4,
          notesStartY + notesLineH * 0.5,
          innerW - colLabelW - 10,
          notesLineH,
          Math.max(9, Math.round(notesLineH * 0.44)),
          textMain
        );

        // 最下部: 施工会社（受注者名）＋ 日付（氏名は除外）
        const botStartY = innerY + innerH - bottomH;
        ctx.beginPath();
        ctx.moveTo(innerX, botStartY);
        ctx.lineTo(innerX + innerW, botStartY);
        ctx.stroke();

        const botCenterY = botStartY + bottomH / 2;
        drawFittedText(ctx, blackboard.constractor || '', innerX + 10, botCenterY, innerW * 0.60, Math.round(bottomH * 0.42), textMain, 'left');

        const displayDate = (blackboard.date || getSystemDateYmd()).replace(/-/g, '.');
        drawFittedText(ctx, displayDate, innerX + innerW - 10, botCenterY, innerW * 0.35, Math.round(bottomH * 0.42), textMain, 'right');

        ctx.restore();
      }, [blackboard]);

      useEffect(() => {
        const renderLoop = () => {
          const canvas = canvasRef.current;
          const video = videoRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const isLandscape = (photoOrientation === 'landscape');
          const canvasW = isLandscape ? 1200 : 900;
          const canvasH = isLandscape ? 900 : 1200;

          if (canvas.width !== canvasW) canvas.width = canvasW;
          if (canvas.height !== canvasH) canvas.height = canvasH;

          ctx.clearRect(0, 0, canvasW, canvasH);

          const isVideoActive = !!(video && video.srcObject && video.videoWidth > 0 && video.videoHeight > 0);

          if (isVideoActive) {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const videoRatio = vw / vh;
            const canvasRatio = canvasW / canvasH;

            // ズーム倍率を考慮した切り出し計算
            const currentZoom = (typeof zoomLevelRef !== 'undefined' && zoomLevelRef.current)
              ? zoomLevelRef.current
              : (typeof zoomLevel !== 'undefined' ? zoomLevel : 1.0);

            let baseWidth, baseHeight;
            if (videoRatio > canvasRatio) {
              baseHeight = vh;
              baseWidth = vh * canvasRatio;
            } else {
              baseWidth = vw;
              baseHeight = vw / canvasRatio;
            }

            // ズーム倍率に合わせて切り出しサイズを中心から縮小（画面いっぱいに拡大）
            const sWidth = baseWidth / currentZoom;
            const sHeight = baseHeight / currentZoom;
            const sx = (vw - sWidth) / 2;
            const sy = (vh - sHeight) / 2;

            try {
              if (facingMode === 'user') {
                ctx.save();
                ctx.translate(canvasW, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvasW, canvasH);
                ctx.restore();
              } else {
                ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvasW, canvasH);
              }
            } catch(e) {}
          } else {
            const grad = ctx.createLinearGradient(0, 0, canvasW, canvasH);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#020617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvasW, canvasH);
          }

          renderBlackboard(ctx, canvasW, canvasH);
          animFrameRef.current = requestAnimationFrame(renderLoop);
        };

        animFrameRef.current = requestAnimationFrame(renderLoop);
        return () => {
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        };
      }, [isStreaming, facingMode, photoOrientation, renderBlackboard, zoomLevel]);

      // シャッター押下：プレビュー確認画面（撮り直し or 送信）を表示
      const handleShutter = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        const cleanType = (blackboard.workType29 || '').replace(/^\d+\.\s*/, '');
        const fullCategory = blackboard.workDetail 
          ? `${cleanType} / ${blackboard.workDetail}` 
          : cleanType;
        const shootingDateYmd = getSystemDateYmd();

        const photoRecord = {
          id: 'photo_' + Date.now(),
          url: dataUrl,
          projectCode: urlConfig.projectCode,
          projectName: blackboard.projectName,
          workCategory: fullCategory,
          location: blackboard.location,
          stage: blackboard.stage,
          stageDetail: blackboard.stageDetail,
          specAndNotes: blackboard.specAndNotes,
          constractor: blackboard.constractor,
          date: shootingDateYmd,
          capturedAt: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
        };

        setPendingPhoto(photoRecord);
      };

      // プレビュー確認後の「送信」実行処理
      const handleConfirmUpload = async () => {
        if (!pendingPhoto) return;

        // 1. 案件ごとのローカル履歴に直近15枚を上限として保持
        const key = getHistoryStorageKey(urlConfig.projectCode);
        const updated = [pendingPhoto, ...recentPhotos].slice(0, 15);
        setRecentPhotos(updated);
        try {
          localStorage.setItem(key, JSON.stringify(updated));
        } catch(e) {
          try {
            const trimmed = [pendingPhoto, ...recentPhotos].slice(0, 5);
            localStorage.setItem(key, JSON.stringify(trimmed));
            setRecentPhotos(trimmed);
          } catch(err2) {}
        }

        // 2. kintoneへ送信
        if (urlConfig.gasUrl) {
          setIsUploading(true);
          try {
            const payload = {
              action: "uploadCapturedPhoto",
              recordId: urlConfig.recordId,
              photoData: {
                photoNo: Date.now(),
                projectCode: urlConfig.projectCode,
                base64Image: pendingPhoto.url,
                stage: pendingPhoto.stage,
                workCategory: pendingPhoto.workCategory,
                location: pendingPhoto.location,
                spec: pendingPhoto.specAndNotes,
                projectName: pendingPhoto.projectName,
                constractor: pendingPhoto.constractor,
                notes: pendingPhoto.specAndNotes,
                date: pendingPhoto.date
              }
            };

            const response = await fetch(urlConfig.gasUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (data.status === 'success' && data.result && data.result.status === 'success') {
              setIsUploading(false);
              setPendingPhoto(null);
              setUploadSuccessAlert('kintoneへ送信完了しました');
              setTimeout(() => setUploadSuccessAlert(null), 3000);
            } else {
              setIsUploading(false);
              const errMsg = (data.result && data.result.message) || data.message || '保存に失敗しました';
              alert('kintone保存エラー:\n' + errMsg);
            }
          } catch(err) {
            setIsUploading(false);
            alert('送信エラー: ' + err.message);
          }
        } else {
          setPendingPhoto(null);
          setUploadSuccessAlert('保存完了 (ローカル)');
          setTimeout(() => setUploadSuccessAlert(null), 2500);
        }
      };

      const handleRetake = () => {
        setPendingPhoto(null);
      };

      const handleClearHistory = () => {
        if (confirm("この端末に一時保存されている撮影履歴を消去しますか？\n※kintoneに送信済みの写真は消えません。")) {
          const key = getHistoryStorageKey(urlConfig.projectCode);
          try {
            localStorage.removeItem(key);
          } catch(e) {}
          setRecentPhotos([]);
        }
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col justify-between pb-6 font-sans">
          
          {/* ヘッダーエリア */}

            <div className="flex items-center gap-2">
              <span className={`w-2 h-2 rounded-full ${isStreaming ? 'bg-emerald-500' : 'bg-slate-500'}`}></span>
              <span className="text-xs font-bold text-white tracking-wide">電子黒板カメラ</span>
              {urlConfig.projectCode && (
                <span className="text-[10px] font-mono text-amber-300 bg-slate-800 px-2 py-0.5 rounded border border-slate-700 truncate max-w-[110px]">
                  {urlConfig.projectCode}
                </span>
              )}
            </div>

            {/* ★撮影のコツ（心得）を開くボタン */}
            <button
              type="button"
              onClick={() => setShowTipsModal(true)}
              className="flex items-center gap-1 bg-amber-500/10 hover:bg-amber-500/20 active:scale-95 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg text-xs font-bold transition shadow-sm"
            >
              <span>💡</span>
              <span>撮影のコツ</span>
            </button>
          </header>

          <div className="bg-slate-900 border-b border-slate-800 px-3 py-1.5 flex items-center justify-around text-xs font-medium">
            <button
              onClick={() => setActiveTab('board')}
              className={`flex-1 py-1.5 text-center rounded-lg transition ${activeTab === 'board' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}

            </button>

            {activeTab === 'board' && (

                  </div>
                </div>

                {/* 撮影情報の簡易サマリー */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs space-y-1">
                  <div className="flex justify-between items-center text-[11px]">
                    <span className="text-slate-400">工種 / 作業種目:</span>
                    <span className="text-slate-200 font-medium truncate max-w-[220px]">{pendingPhoto.workCategory || '-'}</span>
                  </div>
                  <div className="flex justify-between items-center text-[11px]">
                    <span className="text-slate-400">撮影部位:</span>
                    <span className="text-slate-200 truncate max-w-[220px]">{pendingPhoto.location || '-'}</span>
                  </div>
                  {pendingPhoto.specAndNotes && (
                    <div className="pt-1 border-t border-slate-800 text-[10px] text-slate-300 whitespace-pre-wrap line-clamp-2">
                      {pendingPhoto.specAndNotes}
                    </div>
                  )}
                </div>

                {/* 操作アクションボタン：撮り直す vs kintoneに送信 */}
                <div className="grid grid-cols-2 gap-3 pt-1">
                  <button
                    type="button"
                    disabled={isUploading}
                    onClick={handleRetake}
                    className="w-full bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-bold py-3 rounded-xl text-xs transition border border-slate-700 disabled:opacity-50 flex items-center justify-center gap-1.5"
                  >
                    <span>✕</span> 撮り直す
                  </button>
                  <button
                    type="button"
                    disabled={isUploading}
                    onClick={handleConfirmUpload}
                    className="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-emerald-950/50 border border-emerald-400/50 disabled:opacity-50 flex items-center justify-center gap-1.5"
                  >
                    {isUploading ? (
                      <span>送信中...</span>
                    ) : (
                      <>
                        <span>✓</span> kintoneに送信
                      </>
                    )}
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* 履歴写真の拡大＆作業情報詳細確認モーダル */}
          {selectedPhotoModal && (
            <div
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex flex-col justify-between p-4 overflow-y-auto"
              onClick={() => setSelectedPhotoModal(null)}
            >
              <div
                className="max-w-md w-full mx-auto bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl space-y-4 my-auto"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="p-3 bg-slate-800 border-b border-slate-700 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-xs text-white">写真詳細確認</span>
                    <span className="text-[10px] bg-emerald-950 border border-emerald-500/40 text-emerald-300 px-2 py-0.5 rounded">
                      kintone送信済
                    </span>
                  </div>
                  <button
                    type="button"
                    onClick={() => setSelectedPhotoModal(null)}
                    className="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-white rounded-lg bg-slate-700 text-sm"
                  >
                    ✕
                  </button>
                </div>

                <div className="px-3">
                  <div className="w-full aspect-[4/3] bg-black rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
                    <img
                      src={selectedPhotoModal.url}
                      alt="拡大写真"
                      className="w-full h-full object-contain"
                    />
                  </div>
                </div>

                <div className="px-4 pb-4 space-y-3 text-xs">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                    <div className="flex justify-between items-baseline border-b border-slate-900 pb-1.5">
                      <span className="text-slate-400 text-[11px]">工事名</span>
                      <span className="font-bold text-white text-right truncate max-w-[200px]">{selectedPhotoModal.projectName || '-'}</span>
                    </div>
                    <div className="flex justify-between items-baseline border-b border-slate-900 pb-1.5">
                      <span className="text-slate-400 text-[11px]">施工工程</span>
                      <span className="font-bold text-amber-400">{selectedPhotoModal.stage} {selectedPhotoModal.stageDetail ? `(${selectedPhotoModal.stageDetail})` : ''}</span>
                    </div>
                    <div className="flex justify-between items-baseline border-b border-slate-900 pb-1.5">
                      <span className="text-slate-400 text-[11px]">工種 / 作業種目</span>
                      <span className="text-slate-200 font-medium text-right">{selectedPhotoModal.workCategory || '-'}</span>
                    </div>
                    <div className="flex justify-between items-baseline border-b border-slate-900 pb-1.5">
                      <span className="text-slate-400 text-[11px]">撮影部位</span>
                      <span className="text-slate-200 text-right">{selectedPhotoModal.location || '-'}</span>
                    </div>
                    <div className="flex justify-between items-baseline border-b border-slate-900 pb-1.5">
                      <span className="text-slate-400 text-[11px]">撮影日時</span>
                      <span className="text-slate-200 font-mono">{selectedPhotoModal.date || '-'} {selectedPhotoModal.capturedAt || ''}</span>
                    </div>
                    <div className="border-b border-slate-900 pb-1.5">
                      <span className="text-slate-400 text-[11px] block mb-1">特記事項</span>
                      <p className="text-slate-200 whitespace-pre-wrap leading-relaxed text-[11px] bg-slate-900/60 p-2 rounded-lg">
                        {selectedPhotoModal.specAndNotes || '-'}
                      </p>
                    </div>
                    <div className="flex justify-between items-baseline">
                      <span className="text-slate-400 text-[11px]">施工会社</span>
                      <span className="text-slate-300 text-right">{selectedPhotoModal.constractor || '-'}</span>
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={() => setSelectedPhotoModal(null)}
                    className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 rounded-xl transition text-xs"
                  >
                    閉じる
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<MobileCameraApp />, document.getElementById('root'));
  </script>
</body>
</html>
