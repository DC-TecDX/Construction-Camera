<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>現場撮影カメラ (電子小黒板)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; touch-action: manipulation; }
    .camera-container { position: relative; width: 100%; aspect-ratio: 4/3; overflow: hidden; background: #000; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 建設業29種マスター
    const CONSTRUCTION_TYPES_29 = [
      '土木一式工事', '建築一式工事', '大工工事', '左官工事', 'とび・土工・コンクリート工事',
      '石工事', '屋根工事', '電気工事', '管工事', 'タイル・れんが・ブロック工事',
      '鋼構造物工事', '鉄筋工事', '舗装工事', 'しゅんせつ工事', '板金工事',
      'ガラス工事', '塗装工事', '防水工事', '内装仕上工事', '機械器具設置工事',
      '熱絶縁工事', '電気通信工事', '造園工事', 'さく井工事', '建具工事',
      '水道施設工事', '消防施設工事', '清掃施設工事', '解体工事'
    ];

    function MobileCameraApp() {
      // タブの並び順: 看板設定 ➔ 撮影 ➔ 撮影済み
      const [activeTab, setActiveTab] = useState('board');
      const [recordId, setRecordId] = useState('');
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState('');

      // 工事基本情報
      const [projectName, setProjectName] = useState('');
      const [contractorName, setContractorName] = useState('');
      const [manager, setManager] = useState('');
      const [supervisor, setSupervisor] = useState('');
      const [nextPhotoNo, setNextPhotoNo] = useState(1);

      // 看板入力情報（寸法・規格は特記事項へ統合）
      const [constructionType, setConstructionType] = useState('管工事');
      const [constructionTypeDetail, setConstructionTypeDetail] = useState('');
      const [workItem, setWorkItem] = useState('');
      const [workStep, setWorkStep] = useState('');
      const [location, setLocation] = useState('');
      const [notes, setNotes] = useState(''); // 特記事項（寸法・規格等）

      // 看板表示設定（独立設定）
      const [boardDesign, setBoardDesign] = useState('green'); // 'green', 'black', 'white'
      const [boardPosition, setBoardPosition] = useState('bottom-right'); // 'bottom-right', 'bottom-left', 'top-right', 'top-left'
      const [boardScale, setBoardScale] = useState(0.46); // 32% - 55%
      const [boardOpacity, setBoardOpacity] = useState(0.95); // 60% - 100%

      // カメラ関連
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const overlayCanvasRef = useRef(null);
      const [cameraReady, setCameraReady] = useState(false);
      const [capturedPhotos, setCapturedPhotos] = useState([]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };

      // URLパラメータおよびkintoneからの初期データ取得
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const rId = urlParams.get('recordId') || '';
        setRecordId(rId);

        if (rId) {
          setLoading(true);
          google.script.run
            .withSuccessHandler((res) => {
              setLoading(false);
              if (res && res.success) {
                setProjectName(res.projectName || '');
                setContractorName(res.constractorName || '');
                setManager(res.manager || '');
                setSupervisor(res.supervisor || '');
                setNextPhotoNo(res.nextPhotoNo || 1);
                showToast(`工事情報を読み込みました (次回写真No.${res.nextPhotoNo || 1})`);
              }
            })
            .withFailureHandler((err) => {
              setLoading(false);
              showToast('データ取得失敗: ' + err.message);
            })
            .doPost({ action: 'getProject', recordId: rId });
        }
      }, []);

      // カメラ起動
      useEffect(() => {
        if (activeTab === 'camera') {
          startCamera();
        } else {
          stopCamera();
        }
        return () => stopCamera();
      }, [activeTab]);

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } },
            audio: false
          });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
            setCameraReady(true);
          }
        } catch (err) {
          alert('カメラを起動できませんでした: ' + err.message);
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
          streamRef.current = null;
        }
        setCameraReady(false);
      };

      // 電子小黒板の描画関数（工種下の区切り線なし、最下部ラベルなし、寸法・規格統合版）
      const drawBlackboardToCanvas = (ctx, targetWidth, targetHeight) => {
        const bw = targetWidth * boardScale;
        const bh = bw * 0.72; // 4:3 比率に近い黒板アスペクト

        let bx = targetWidth - bw - 16;
        let by = targetHeight - bh - 16;
        if (boardPosition === 'bottom-left') { bx = 16; by = targetHeight - bh - 16; }
        else if (boardPosition === 'top-right') { bx = targetWidth - bw - 16; by = 16; }
        else if (boardPosition === 'top-left') { bx = 16; by = 16; }

        ctx.save();
        ctx.globalAlpha = boardOpacity;

        // デザインごとのパレット設定
        let bgColor = '#1b3b2b'; // 深緑黒板
        let frameColor = '#8b5a2b';
        let textColor = '#ffffff';
        let subTextColor = '#fef08a';
        let lineStroke = 'rgba(255, 255, 255, 0.4)';

        if (boardDesign === 'black') {
          bgColor = '#1e1e1e';
          frameColor = '#3f3f46';
          textColor = '#ffffff';
          subTextColor = '#67e8f9';
          lineStroke = 'rgba(255, 255, 255, 0.3)';
        } else if (boardDesign === 'white') {
          bgColor = '#f8fafc';
          frameColor = '#94a3b8';
          textColor = '#0f172a';
          subTextColor = '#0369a1';
          lineStroke = 'rgba(15, 23, 42, 0.3)';
        }

        // 外枠と黒板本体
        ctx.fillStyle = frameColor;
        ctx.fillRect(bx, by, bw, bh);
        const innerMargin = bw * 0.02;
        ctx.fillStyle = bgColor;
        ctx.fillRect(bx + innerMargin, by + innerMargin, bw - innerMargin * 2, bh - innerMargin * 2);

        const contentX = bx + innerMargin + 6;
        const contentW = bw - (innerMargin * 2) - 12;
        const fontSizeMain = Math.max(11, Math.round(bw * 0.048));
        const fontSizeSub = Math.max(9, Math.round(bw * 0.038));

        // 1行目: 工事名
        const row1H = bh * 0.18;
        ctx.font = `bold ${fontSizeSub}px sans-serif`;
        ctx.fillStyle = textColor;
        ctx.fillText('工事名', contentX, by + innerMargin + (row1H * 0.68));

        ctx.font = `bold ${fontSizeMain}px sans-serif`;
        ctx.fillStyle = subTextColor;
        ctx.fillText(projectName || '工事名称未設定', contentX + (bw * 0.18), by + innerMargin + (row1H * 0.68), contentW - (bw * 0.18));

        // 工事名の下の区切り線
        ctx.strokeStyle = lineStroke;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(contentX, by + innerMargin + row1H);
        ctx.lineTo(contentX + contentW, by + innerMargin + row1H);
        ctx.stroke();

        // 2行目: 工種
        const row2H = bh * 0.18;
        const row2Y = by + innerMargin + row1H;
        ctx.font = `bold ${fontSizeSub}px sans-serif`;
        ctx.fillStyle = textColor;
        ctx.fillText('工種', contentX, row2Y + (row2H * 0.68));

        const fullType = constructionType + (constructionTypeDetail ? ` / ${constructionTypeDetail}` : '');
        ctx.font = `bold ${fontSizeMain}px sans-serif`;
        ctx.fillStyle = textColor;
        ctx.fillText(fullType, contentX + (bw * 0.18), row2Y + (row2H * 0.68), contentW - (bw * 0.18));

        // 工種の下の区切り線
        ctx.beginPath();
        ctx.moveTo(contentX, row2Y + row2H);
        ctx.lineTo(contentX + contentW, row2Y + row2H);
        ctx.stroke();

        // 中間フリー領域（区切り線・縦線なし！）
        // 作業内容・施工箇所・特記事項（寸法・規格等）を配置
        const middleY = row2Y + row2H + 6;
        const footerH = bh * 0.18;
        const middleH = bh - (innerMargin * 2) - (row1H + row2H + footerH) - 10;

        ctx.font = `${fontSizeSub}px sans-serif`;
        let textY = middleY + (fontSizeSub * 1.1);

        if (location) {
          ctx.fillStyle = textColor;
          ctx.fillText(`【箇所】 ${location}`, contentX + 2, textY, contentW - 4);
          textY += fontSizeSub * 1.35;
        }

        if (workItem || workStep) {
          ctx.fillStyle = textColor;
          const workText = `【内容】 ${workItem}${workStep ? ` (${workStep})` : ''}`;
          ctx.fillText(workText, contentX + 2, textY, contentW - 4);
          textY += fontSizeSub * 1.35;
        }

        if (notes) {
          ctx.fillStyle = subTextColor;
          ctx.fillText(`【特記・寸法】 ${notes}`, contentX + 2, textY, contentW - 4);
        }

        // 最下部（フッター）の上部区切り線
        const footerY = by + bh - innerMargin - footerH;
        ctx.beginPath();
        ctx.moveTo(contentX, footerY);
        ctx.lineTo(contentX + contentW, footerY);
        ctx.stroke();

        // 最下部: 施工会社名（左・ラベルなし） / 撮影日（右・ラベルなし）
        const now = new Date();
        const dateStr = `${now.getFullYear()}.${now.getMonth() + 1}.${now.getDate()}`;

        ctx.font = `bold ${fontSizeSub}px sans-serif`;
        ctx.fillStyle = textColor;
        // 左側: 施工会社名のみ
        ctx.fillText(contractorName || '施工会社', contentX + 2, footerY + (footerH * 0.65), contentW * 0.62);

        // 右側: 撮影日のみ
        ctx.textAlign = 'right';
        ctx.fillText(dateStr, contentX + contentW - 2, footerY + (footerH * 0.65));
        ctx.textAlign = 'left';

        ctx.restore();
      };

      // リアルタイムオーバーレイプレビュー
      useEffect(() => {
        let animId;
        const renderLoop = () => {
          if (activeTab === 'camera' && overlayCanvasRef.current && videoRef.current) {
            const canvas = overlayCanvasRef.current;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            drawBlackboardToCanvas(ctx, w, h);
          }
          animId = requestAnimationFrame(renderLoop);
        };
        if (activeTab === 'camera') {
          animId = requestAnimationFrame(renderLoop);
        }
        return () => cancelAnimationFrame(animId);
      }, [activeTab, boardDesign, boardPosition, boardScale, boardOpacity, projectName, contractorName, constructionType, constructionTypeDetail, workItem, workStep, location, notes]);

      // シャッター撮影 ＆ kintoneアップロード
      const takePhotoAndUpload = () => {
        if (!videoRef.current || !cameraReady || loading) return;
        setLoading(true);

        const video = videoRef.current;
        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = video.videoWidth || 1920;
        offscreenCanvas.height = video.videoHeight || 1440;
        const ctx = offscreenCanvas.getContext('2d');

        // 1. 実写フレーム描画
        ctx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);

        // 2. 電子小黒板合成
        drawBlackboardToCanvas(ctx, offscreenCanvas.width, offscreenCanvas.height);

        // 3. JPEGデータ化
        const base64Image = offscreenCanvas.toDataURL('image/jpeg', 0.88);

        // 4. kintoneへ送信
        const payload = {
          action: 'uploadPhoto',
          recordId: recordId,
          image: base64Image,
          constructionType: constructionType + (constructionTypeDetail ? ` / ${constructionTypeDetail}` : ''),
          workItem: workItem,
          workStep: workStep,
          location: location,
          notes: notes,
          company: contractorName,
          manager: manager,
          supervisor: supervisor,
          date: new Date().toLocaleString('ja-JP')
        };

        google.script.run
          .withSuccessHandler((res) => {
            setLoading(false);
            if (res && res.success) {
              showToast(`写真No.${res.photoNo} をkintoneに登録しました！`);
              setNextPhotoNo(res.photoNo + 1);
              setCapturedPhotos(prev => [
                { photoNo: res.photoNo, image: base64Image, time: new Date().toLocaleTimeString('ja-JP') },
                ...prev
              ]);
            } else {
              alert('アップロード失敗: ' + (res.message || '不明なエラー'));
            }
          })
          .withFailureHandler((err) => {
            setLoading(false);
            alert('通信エラー: ' + err.message);
          })
          .doPost(payload);
      };

      return (
        <div className="max-w-md mx-auto flex flex-col h-screen select-none">
          {/* ヘッダー */}
          <header className="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center">
            <div>
              <h1 className="font-bold text-sm tracking-wide text-emerald-400">現場記録カメラ (電子小黒板)</h1>
              <p className="text-xs text-slate-400 truncate max-w-[200px]">{projectName || '現場未選択'}</p>
            </div>
            <div className="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">
              次回: No.{nextPhotoNo}
            </div>
          </header>

          {/* トースト表示 */}
          {toast && (
            <div className="fixed top-14 left-1/2 transform -translate-x-1/2 z-50 bg-emerald-600 text-white text-xs px-4 py-2 rounded-full shadow-lg transition-all">
              {toast}
            </div>
          )}

          {/* メインビュー */}
          <main className="flex-1 overflow-y-auto">
            {/* タブ①: 看板設定 */}
            {activeTab === 'board' && (
              <div className="p-4 space-y-4">
                <div className="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-3">
                  <h2 className="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                    <span>📋</span> 工種・作業内容設定
                  </h2>

                  <div>
                    <label className="text-[11px] text-slate-300 block mb-1">建設業29種 (工種選択)</label>
                    <select
                      value={constructionType}
                      onChange={(e) => setConstructionType(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    >
                      {CONSTRUCTION_TYPES_29.map((type) => (
                        <option key={type} value={type}>{type}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-[11px] text-slate-300 block mb-1">工種詳細・工事内容 (自由記載)</label>
                    <input
                      type="text"
                      placeholder="例: 配管撤去・更新工事"
                      value={constructionTypeDetail}
                      onChange={(e) => setConstructionTypeDetail(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] text-slate-300 block mb-1">作業内容 / 種別</label>
                      <input
                        type="text"
                        placeholder="例: 配管切断状況"
                        value={workItem}
                        onChange={(e) => setWorkItem(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-slate-300 block mb-1">細別 / 工程</label>
                      <input
                        type="text"
                        placeholder="例: 施工中"
                        value={workStep}
                        onChange={(e) => setWorkStep(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] text-slate-300 block mb-1">施工箇所</label>
                    <input
                      type="text"
                      placeholder="例: 3F 機械室 南面"
                      value={location}
                      onChange={(e) => setLocation(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  {/* 特記事項（寸法・規格等）の統合入力欄 */}
                  <div>
                    <label className="text-[11px] text-slate-300 block mb-1 flex justify-between">
                      <span>特記事項（寸法・規格等）</span>
                      <span className="text-emerald-400">※寸法・材料・設計実測値を統合記載</span>
                    </label>
                    <textarea
                      rows="2"
                      placeholder="例: 冷温水配管 100A / 実測外径φ114.3mm / 設計図通り"
                      value={notes}
                      onChange={(e) => setNotes(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                </div>

                {/* 看板表示設定ブロック（独立） */}
                <div className="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-3">
                  <h2 className="text-xs font-bold text-amber-400 flex items-center gap-1.5">
                    <span>🎨</span> 看板デザイン・表示設定
                  </h2>

                  <div className="grid grid-cols-3 gap-2">
                    <button
                      type="button"
                      onClick={() => setBoardDesign('green')}
                      className={`p-2 rounded-lg border text-xs font-medium text-center ${boardDesign === 'green' ? 'bg-emerald-900/60 border-emerald-500 text-emerald-200' : 'bg-slate-900 border-slate-700 text-slate-400'}`}
                    >
                      深緑黒板
                    </button>
                    <button
                      type="button"
                      onClick={() => setBoardDesign('black')}
                      className={`p-2 rounded-lg border text-xs font-medium text-center ${boardDesign === 'black' ? 'bg-zinc-800 border-zinc-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'}`}
                    >
                      黒色黒板
                    </button>
                    <button
                      type="button"
                      onClick={() => setBoardDesign('white')}
                      className={`p-2 rounded-lg border text-xs font-medium text-center ${boardDesign === 'white' ? 'bg-slate-200 border-slate-400 text-slate-900' : 'bg-slate-900 border-slate-700 text-slate-400'}`}
                    >
                      ホワイト
                    </button>
                  </div>

                  <div className="grid grid-cols-2 gap-3 pt-1">
                    <div>
                      <label className="text-[11px] text-slate-400 block mb-1">表示位置</label>
                      <select
                        value={boardPosition}
                        onChange={(e) => setBoardPosition(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white"
                      >
                        <option value="bottom-right">右下</option>
                        <option value="bottom-left">左下</option>
                        <option value="top-right">右上</option>
                        <option value="top-left">左上</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-[11px] text-slate-400 block mb-1">
                        サイズ: {Math.round(boardScale * 100)}%
                      </label>
                      <input
                        type="range"
                        min="0.32"
                        max="0.55"
                        step="0.01"
                        value={boardScale}
                        onChange={(e) => setBoardScale(parseFloat(e.target.value))}
                        className="w-full accent-emerald-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">
                      看板の不透明度: {Math.round(boardOpacity * 100)}%
                    </label>
                    <input
                      type="range"
                      min="0.6"
                      max="1.0"
                      step="0.05"
                      value={boardOpacity}
                      onChange={(e) => setBoardOpacity(parseFloat(e.target.value))}
                      className="w-full accent-amber-500"
                    />
                  </div>
                </div>

                {/* 現場・担当者情報 */}
                <div className="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-2">
                  <h2 className="text-xs font-bold text-sky-400 flex items-center gap-1.5">
                    <span>🏢</span> 現場・立会情報
                  </h2>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div>
                      <label className="text-[10px] text-slate-400 block">施工責任者</label>
                      <input
                        type="text"
                        value={manager}
                        onChange={(e) => setManager(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 block">立会者</label>
                      <input
                        type="text"
                        value={supervisor}
                        onChange={(e) => setSupervisor(e.target.value)}
                        placeholder="立会者氏名"
                        className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white"
                      />
                    </div>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={() => setActiveTab('camera')}
                  className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex justify-center items-center gap-2"
                >
                  <span>📷</span> この看板設定で撮影へ進む
                </button>
              </div>
            )}

            {/* タブ②: 撮影 */}
            {activeTab === 'camera' && (
              <div className="flex flex-col h-full bg-black">
                <div className="camera-container flex-1 flex items-center justify-center">
                  <video
                    ref={videoRef}
                    playsInline
                    muted
                    className="w-full h-full object-cover"
                  />
                  <canvas
                    ref={overlayCanvasRef}
                    width={800}
                    height={600}
                    className="absolute inset-0 w-full h-full pointer-events-none"
                  />
                  {loading && (
                    <div className="absolute inset-0 bg-black/70 flex flex-col items-center justify-center text-white z-20">
                      <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-400 mb-2"></div>
                      <p className="text-xs font-bold">kintoneへ写真を登録中...</p>
                    </div>
                  )}
                </div>

                {/* シャッター操作部 */}
                <div className="bg-slate-950 p-4 flex justify-around items-center border-t border-slate-800">
                  <button
                    type="button"
                    onClick={() => setActiveTab('board')}
                    className="text-xs text-slate-400 flex flex-col items-center gap-1"
                  >
                    <span>📋</span>
                    <span>看板再設定</span>
                  </button>

                  <button
                    type="button"
                    disabled={loading || !cameraReady}
                    onClick={takePhotoAndUpload}
                    className={`w-16 h-16 rounded-full border-4 flex items-center justify-center shadow-xl active:scale-95 transition-all ${loading ? 'border-slate-600 bg-slate-700' : 'border-white bg-emerald-500'}`}
                  >
                    <div className="w-12 h-12 rounded-full border-2 border-white/60"></div>
                  </button>

                  <button
                    type="button"
                    onClick={() => setActiveTab('gallery')}
                    className="text-xs text-slate-400 flex flex-col items-center gap-1"
                  >
                    <span>🖼️</span>
                    <span>撮影済 ({capturedPhotos.length})</span>
                  </button>
                </div>
              </div>
            )}

            {/* タブ③: 撮影済み */}
            {activeTab === 'gallery' && (
              <div className="p-4 space-y-3">
                <div className="flex justify-between items-center mb-2">
                  <h2 className="text-xs font-bold text-slate-300">今回のセッションで撮影した写真</h2>
                  <span className="text-xs text-emerald-400">{capturedPhotos.length} 枚</span>
                </div>

                {capturedPhotos.length === 0 ? (
                  <div className="text-center py-12 text-slate-500 text-xs">
                    まだ撮影された写真はありません。
                  </div>
                ) : (
                  <div className="grid grid-cols-2 gap-3">
                    {capturedPhotos.map((item, idx) => (
                      <div key={idx} className="bg-slate-800 rounded-xl overflow-hidden border border-slate-700">
                        <img src={item.image} alt="撮影画像" className="w-full aspect-4/3 object-cover" />
                        <div className="p-2 flex justify-between items-center text-[11px]">
                          <span className="font-bold text-emerald-400">写真 No.{item.photoNo}</span>
                          <span className="text-slate-400">{item.time}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* 下部ナビゲーションタブ */}
          <nav className="bg-slate-900 border-t border-slate-800 grid grid-cols-3 text-center text-xs">
            <button
              onClick={() => setActiveTab('board')}
              className={`py-3 flex flex-col items-center gap-1 ${activeTab === 'board' ? 'text-emerald-400 font-bold border-t-2 border-emerald-400 bg-slate-800/50' : 'text-slate-400'}`}
            >
              <span>📋</span>
              <span>看板設定</span>
            </button>
            <button
              onClick={() => setActiveTab('camera')}
              className={`py-3 flex flex-col items-center gap-1 ${activeTab === 'camera' ? 'text-emerald-400 font-bold border-t-2 border-emerald-400 bg-slate-800/50' : 'text-slate-400'}`}
            >
              <span>📷</span>
              <span>撮影</span>
            </button>
            <button
              onClick={() => setActiveTab('gallery')}
              className={`py-3 flex flex-col items-center gap-1 ${activeTab === 'gallery' ? 'text-emerald-400 font-bold border-t-2 border-emerald-400 bg-slate-800/50' : 'text-slate-400'}`}
            >
              <span>🖼️</span>
              <span>撮影済み</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MobileCameraApp />);
  </script>
</body>
</html>
