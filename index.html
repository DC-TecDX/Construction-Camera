<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>電子黒板カメラ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #020617;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const CONSTRUCTION_29_TYPES = [
      "1. 土木一式工事", "2. 建築一式工事", "3. 大工工事", "4. 左官工事",
      "5. とび・土工・コンクリート工事", "6. 石工事", "7. 屋根工事", "8. 電気工事",
      "9. 管工事", "10. タイル・れんが・ブロック工事", "11. 鋼構造物工事", "12. 鉄筋工事",
      "13. 舗装工事", "14. しゅんせつ工事", "15. 板金工事", "16. ガラス工事",
      "17. 塗装工事", "18. 防水工事", "19. 内装仕上工事", "20. 機械器具設置工事",
      "21. 熱絶縁工事", "22. 電気通信工事", "23. 造園工事", "24. さく井工事",
      "25. 建具工事", "26. 水道施設工事", "27. 消防施設工事", "28. 清掃施設工事",
      "29. 解体工事", "その他"
    ];

    const STAGE_OPTIONS = [
      { id: '施工前', label: '施工前' },
      { id: '施工中', label: '施工中' },
      { id: '施工完了', label: '施工完了' },
      { id: '材料・機材', label: '材料確認' },
      { id: '自主検査', label: '自主検査' },
      { id: '産業廃棄物', label: '発生材' }
    ];

    // JSTシステム日付 (YYYY-MM-DD)
    const getSystemDateYmd = () => {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    function MobileCameraApp() {
      const [activeTab, setActiveTab] = useState('board');
      const [isStreaming, setIsStreaming] = useState(false);
      const [streamError, setStreamError] = useState(null);
      const [facingMode, setFacingMode] = useState('environment');
      const [isUploading, setIsUploading] = useState(false);
      const [uploadSuccessAlert, setUploadSuccessAlert] = useState(null);

      const [photoOrientation, setPhotoOrientation] = useState('landscape');

      const [urlConfig, setUrlConfig] = useState({
        gasUrl: '',
        recordId: '',
        projectCode: ''
      });

      const [blackboard, setBlackboard] = useState({
        projectName: '工事記録写真',
        workType29: '13. 舗装工事',
        workDetail: '舗装打換え工',
        location: '西側歩道 A区画',
        stage: '施工中',
        stageDetail: '路盤整正',
        specAndNotes: 'アスファルト舗装 t=50mm\n路面クラック修繕確認',
        constractor: '施工会社',
        date: getSystemDateYmd(),
        theme: 'green',
        scale: 0.44,
        opacity: 1.0,
        position: 'bottom-right'
      });

      const [recentPhotos, setRecentPhotos] = useState(() => {
        try {
          const s = localStorage.getItem('FIELD_PHOTO_HISTORY');
          if (s) return JSON.parse(s);
        } catch (e) {}
        return [];
      });

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const animFrameRef = useRef(null);

      useEffect(() => {
        try {
          const p = new URLSearchParams(window.location.search);
          const gasUrl = p.get('gasUrl') || '';
          const recordId = p.get('recordId') || '';
          const projectCode = p.get('projectCode') || '';

          setUrlConfig({ gasUrl, recordId, projectCode });

          const pName = p.get('projectName');
          const cName = p.get('constractor') || p.get('contractor');
          const loc = p.get('location');

          if (pName || cName || loc) {
            setBlackboard(prev => ({
              ...prev,
              projectName: pName ? decodeURIComponent(pName) : prev.projectName,
              constractor: cName ? decodeURIComponent(cName) : prev.constractor,
              location: loc ? decodeURIComponent(loc) : prev.location,
              date: getSystemDateYmd()
            }));
          }

          if (gasUrl && recordId) {
            fetch(gasUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({ action: 'getProjectDetail', recordId: recordId })
            })
            .then(res => res.json())
            .then(data => {
              if (data && data.record) {
                const rec = data.record;
                setBlackboard(prev => ({
                  ...prev,
                  projectName: rec.ProjectName?.value || prev.projectName,
                  constractor: rec.ConstractorName?.value || prev.constractor,
                  location: rec.WorkLocation?.value || prev.location,
                  date: getSystemDateYmd()
                }));
              }
            })
            .catch(() => {});
          }
        } catch (e) {}
      }, []);

      const startCamera = async (targetFacing = facingMode) => {
        setStreamError(null);
        if (streamRef.current) {
          try { streamRef.current.getTracks().forEach(t => t.stop()); } catch(e) {}
          streamRef.current = null;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStreamError('カメラ機能に対応していません');
          return;
        }

        const tryConstraints = [
          { video: { facingMode: targetFacing }, audio: false },
          { video: { facingMode: { ideal: targetFacing } }, audio: false },
          { video: true, audio: false }
        ];

        let activeStream = null;
        for (const constraints of tryConstraints) {
          try {
            activeStream = await navigator.mediaDevices.getUserMedia(constraints);
            if (activeStream) break;
          } catch (err) {}
        }

        if (!activeStream) {
          setStreamError('カメラを起動できませんでした。アクセス許可を確認してください');
          setIsStreaming(false);
          return;
        }

        streamRef.current = activeStream;
        const video = videoRef.current;
        if (video) {
          video.srcObject = activeStream;
          video.setAttribute('playsinline', 'true');
          video.setAttribute('webkit-playsinline', 'true');
          video.muted = true;
          try {
            await video.play();
            setIsStreaming(true);
            setStreamError(null);
          } catch (e) {
            setIsStreaming(true);
          }
        }
      };

      useEffect(() => {
        if (activeTab === 'camera') {
          startCamera(facingMode);
        }
        return () => {
          if (streamRef.current) {
            try { streamRef.current.getTracks().forEach(t => t.stop()); } catch(e){}
          }
        };
      }, [facingMode, activeTab]);

      const handleToggleFacing = () => {
        const next = facingMode === 'environment' ? 'user' : 'environment';
        setFacingMode(next);
      };

      const drawFittedText = (ctx, text, x, y, maxWidth, baseFontSize, color, align = 'left') => {
        if (!text) return;
        ctx.save();
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        let fontSize = baseFontSize;
        ctx.font = `bold ${fontSize}px "Noto Sans JP", sans-serif`;
        while (ctx.measureText(text).width > maxWidth && fontSize > 7) {
          fontSize -= 0.5;
          ctx.font = `bold ${fontSize}px "Noto Sans JP", sans-serif`;
        }
        let txt = text;
        if (ctx.measureText(txt).width > maxWidth) {
          while (txt.length > 1 && ctx.measureText(txt + '…').width > maxWidth) {
            txt = txt.slice(0, -1);
          }
          txt += '…';
        }
        ctx.fillText(txt, x, y);
        ctx.restore();
      };

      const drawTwoLineText = (ctx, text, x, startY, maxWidth, lineHeight, baseFontSize, color) => {
        if (!text) return;
        ctx.save();
        ctx.fillStyle = color;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';

        let fontSize = baseFontSize;
        ctx.font = `bold ${fontSize}px "Noto Sans JP", sans-serif`;

        let lines = text.split('\n').filter(Boolean);
        if (lines.length > 2) {
          lines = [lines[0], lines.slice(1).join(' ')];
        }

        if (lines.length === 1) {
          const fullText = lines[0];
          if (ctx.measureText(fullText).width > maxWidth) {
            let splitIndex = Math.floor(fullText.length / 2);
            for (let i = 1; i < fullText.length; i++) {
              if (ctx.measureText(fullText.slice(0, i)).width > maxWidth - 10) {
                splitIndex = Math.max(1, i - 1);
                break;
              }
            }
            lines = [fullText.slice(0, splitIndex), fullText.slice(splitIndex)];
          }
        }

        lines.slice(0, 2).forEach((lineStr, lineIdx) => {
          let lineY = startY + (lineIdx * lineHeight);
          let currentStr = lineStr;
          if (ctx.measureText(currentStr).width > maxWidth) {
            while (currentStr.length > 1 && ctx.measureText(currentStr + '…').width > maxWidth) {
              currentStr = currentStr.slice(0, -1);
            }
            currentStr += '…';
          }
          ctx.fillText(currentStr, x, lineY);
        });

        ctx.restore();
      };

      const renderBlackboard = useCallback((ctx, w, h) => {
        const boardW = Math.round(w * blackboard.scale);
        const boardH = Math.round(boardW * 0.70);
        const margin = 16;

        let bx = w - boardW - margin;
        let by = h - boardH - margin;
        if (blackboard.position === 'bottom-left') { bx = margin; by = h - boardH - margin; }
        else if (blackboard.position === 'top-right') { bx = w - boardW - margin; by = margin; }
        else if (blackboard.position === 'top-left') { bx = margin; by = margin; }

        ctx.save();
        ctx.globalAlpha = blackboard.opacity;

        let frameColor = '#3d1f08';
        let innerBg = '#0d3822';
        let textMain = '#ffffff';
        let textSub = '#fef08a';
        let lineCol = 'rgba(255, 255, 255, 0.4)';

        if (blackboard.theme === 'black') {
          frameColor = '#18181b';
          innerBg = '#09090b';
          textMain = '#f4f4f5';
          textSub = '#fde047';
          lineCol = 'rgba(255, 255, 255, 0.3)';
        } else if (blackboard.theme === 'white') {
          frameColor = '#94a3b8';
          innerBg = '#ffffff';
          textMain = '#0f172a';
          textSub = '#0369a1';
          lineCol = 'rgba(15, 23, 42, 0.3)';
        }

        const bw = 5;
        ctx.fillStyle = frameColor;
        ctx.fillRect(bx, by, boardW, boardH);

        const innerX = bx + bw;
        const innerY = by + bw;
        const innerW = boardW - bw * 2;
        const innerH = boardH - bw * 2;

        ctx.fillStyle = innerBg;
        ctx.fillRect(innerX, innerY, innerW, innerH);

        const row1H = innerH * 0.16;
        const row2H = innerH * 0.16;
        const bottomH = innerH * 0.15;
        const midH = innerH - (row1H + row2H + bottomH);

        const colLabelW = Math.round(innerW * 0.23);

        ctx.strokeStyle = lineCol;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(innerX, innerY + row1H);
        ctx.lineTo(innerX + innerW, innerY + row1H);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(innerX + colLabelW, innerY);
        ctx.lineTo(innerX + colLabelW, innerY + row1H * 2);
        ctx.stroke();

        drawFittedText(ctx, "工事名", innerX + colLabelW / 2, innerY + row1H / 2, colLabelW - 6, Math.round(row1H * 0.40), textMain, 'center');
        drawFittedText(ctx, blackboard.projectName, innerX + colLabelW + 8, innerY + row1H / 2, innerW - colLabelW - 14, Math.round(row1H * 0.40), textSub, 'left');

        ctx.beginPath();
        ctx.moveTo(innerX, innerY + row1H + row2H);
        ctx.lineTo(innerX + innerW, innerY + row1H + row2H);
        ctx.stroke();

        const fullWorkCategory = `${blackboard.workType29.replace(/^\d+\.\s*/, '')} / ${blackboard.workDetail}`;
        drawFittedText(ctx, "工種", innerX + colLabelW / 2, innerY + row1H + row2H / 2, colLabelW - 6, Math.round(row2H * 0.40), textMain, 'center');
        drawFittedText(ctx, fullWorkCategory, innerX + colLabelW + 8, innerY + row1H + row2H / 2, innerW - colLabelW - 14, Math.round(row2H * 0.40), textMain, 'left');

        const midStartY = innerY + row1H + row2H;
        const lineUnitH = midH / 4;

        const locY = midStartY + lineUnitH * 0.5;
        drawFittedText(ctx, "撮影場所:", innerX + 8, locY, colLabelW, Math.round(lineUnitH * 0.44), textMain, 'left');
        drawFittedText(ctx, blackboard.location || '-', innerX + colLabelW + 4, locY, innerW - colLabelW - 10, Math.round(lineUnitH * 0.44), textMain, 'left');

        const stgY = midStartY + lineUnitH * 1.5;
        drawFittedText(ctx, "施工状況:", innerX + 8, stgY, colLabelW, Math.round(lineUnitH * 0.44), textMain, 'left');
        const stageText = `${blackboard.stage} (${blackboard.stageDetail})`;
        drawFittedText(ctx, stageText, innerX + colLabelW + 4, stgY, innerW - colLabelW - 10, Math.round(lineUnitH * 0.44), textSub, 'left');

        const notesLabelY = midStartY + lineUnitH * 2.5;
        drawFittedText(ctx, "特記事項:", innerX + 8, notesLabelY, colLabelW, Math.round(lineUnitH * 0.44), textMain, 'left');

        const notesLine1Y = midStartY + lineUnitH * 2.5;
        const notesLineHeight = lineUnitH * 0.90;
        const notesFontSize = Math.max(9, Math.round(lineUnitH * 0.42));

        drawTwoLineText(
          ctx,
          blackboard.specAndNotes || '-',
          innerX + colLabelW + 4,
          notesLine1Y,
          innerW - colLabelW - 10,
          notesLineHeight,
          notesFontSize,
          textMain
        );

        const botStartY = innerY + innerH - bottomH;
        ctx.beginPath();
        ctx.moveTo(innerX, botStartY);
        ctx.lineTo(innerX + innerW, botStartY);
        ctx.stroke();

        const botCenterY = botStartY + bottomH / 2;
        drawFittedText(ctx, blackboard.constractor || '', innerX + 10, botCenterY, innerW * 0.60, Math.round(bottomH * 0.42), textMain, 'left');
        
        // 黒板上の日付表示（システム自動日付 YYYY.MM.DD）
        const displayDate = (blackboard.date || getSystemDateYmd()).replace(/-/g, '.');
        drawFittedText(ctx, displayDate, innerX + innerW - 10, botCenterY, innerW * 0.35, Math.round(bottomH * 0.42), textMain, 'right');

        ctx.restore();
      }, [blackboard]);

      useEffect(() => {
        const renderLoop = () => {
          const canvas = canvasRef.current;
          const video = videoRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const isLandscape = (photoOrientation === 'landscape');
          const canvasW = isLandscape ? 1200 : 900;
          const canvasH = isLandscape ? 900 : 1200;

          if (canvas.width !== canvasW) canvas.width = canvasW;
          if (canvas.height !== canvasH) canvas.height = canvasH;

          ctx.clearRect(0, 0, canvasW, canvasH);

          const isVideoActive = !!(video && video.srcObject && video.videoWidth > 0 && video.videoHeight > 0);

          if (isVideoActive) {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const videoRatio = vw / vh;
            const canvasRatio = canvasW / canvasH;

            let sx, sy, sWidth, sHeight;
            if (videoRatio > canvasRatio) {
              sHeight = vh;
              sWidth = vh * canvasRatio;
              sx = (vw - sWidth) / 2;
              sy = 0;
            } else {
              sWidth = vw;
              sHeight = vw / canvasRatio;
              sx = 0;
              sy = (vh - sHeight) / 2;
            }

            try {
              if (facingMode === 'user') {
                ctx.save();
                ctx.translate(canvasW, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvasW, canvasH);
                ctx.restore();
              } else {
                ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvasW, canvasH);
              }
            } catch(e) {}
          } else {
            const grad = ctx.createLinearGradient(0, 0, canvasW, canvasH);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#020617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvasW, canvasH);
          }

          renderBlackboard(ctx, canvasW, canvasH);
          animFrameRef.current = requestAnimationFrame(renderLoop);
        };

        animFrameRef.current = requestAnimationFrame(renderLoop);
        return () => {
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        };
      }, [isStreaming, facingMode, photoOrientation, renderBlackboard]);

      const handleShutter = async () => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        const fullCategory = `${blackboard.workType29.replace(/^\d+\.\s*/, '')} / ${blackboard.workDetail}`;
        
        // 偽造防止：シャッター押下時のシステム日付（YYYY-MM-DD）
        const shootingDateYmd = getSystemDateYmd();

        const photoRecord = {
          id: 'photo_' + Date.now(),
          url: dataUrl,
          stage: blackboard.stage,
          workCategory: fullCategory,
          location: blackboard.location,
          capturedAt: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
        };

        const updated = [photoRecord, ...recentPhotos];
        setRecentPhotos(updated);
        try {
          localStorage.setItem('FIELD_PHOTO_HISTORY', JSON.stringify(updated));
        } catch(e) {}

        if (urlConfig.gasUrl) {
          setIsUploading(true);
          try {
            const payload = {
              action: "uploadCapturedPhoto",
              recordId: urlConfig.recordId,
              photoData: {
                photoNo: Date.now(),
                projectCode: urlConfig.projectCode,
                base64Image: dataUrl,
                stage: blackboard.stage,
                workCategory: fullCategory,
                location: blackboard.location,
                spec: blackboard.specAndNotes,
                projectName: blackboard.projectName,
                constractor: blackboard.constractor,
                notes: blackboard.specAndNotes,
                date: shootingDateYmd // kintoneのBbDateへYYYY-MM-DDで送信
              }
            };

            await fetch(urlConfig.gasUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify(payload),
              mode: 'no-cors'
            });

            setIsUploading(false);
            setUploadSuccessAlert('送信完了');
            setTimeout(() => setUploadSuccessAlert(null), 3000);
          } catch(err) {
            setIsUploading(false);
            alert('送信エラー: ' + err.message);
          }
        } else {
          setUploadSuccessAlert('保存完了');
          setTimeout(() => setUploadSuccessAlert(null), 2500);
        }
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col justify-between pb-6 font-sans">
          
          <header className="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className={`w-2 h-2 rounded-full ${isStreaming ? 'bg-emerald-500' : 'bg-slate-500'}`}></span>
              <span className="text-xs font-bold text-white tracking-wide">電子黒板カメラ</span>
            </div>
            {urlConfig.projectCode && (
              <span className="text-[11px] font-mono text-amber-300 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">
                {urlConfig.projectCode}
              </span>
            )}
          </header>

          <div className="bg-slate-900 border-b border-slate-800 px-3 py-1.5 flex items-center justify-around text-xs font-medium">
            <button
              onClick={() => setActiveTab('board')}
              className={`flex-1 py-1.5 text-center rounded-lg transition ${activeTab === 'board' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}
            >
              黒板設定
            </button>
            <button
              onClick={() => setActiveTab('camera')}
              className={`flex-1 py-1.5 text-center rounded-lg transition ${activeTab === 'camera' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}
            >
              撮影
            </button>
            <button
              onClick={() => setActiveTab('history')}
              className={`flex-1 py-1.5 text-center rounded-lg transition ${activeTab === 'history' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}
            >
              履歴 ({recentPhotos.length})
            </button>
          </div>

          {uploadSuccessAlert && (
            <div className="mx-3 mt-2 bg-emerald-950 border border-emerald-500/60 text-emerald-200 text-xs p-2.5 rounded-xl text-center">
              {uploadSuccessAlert}
            </div>
          )}

          <main className="flex-1 p-3 space-y-3">

            {activeTab === 'board' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4 text-xs">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <span className="font-bold text-slate-200 text-sm">黒板項目設定</span>
                  <button
                    type="button"
                    onClick={() => setActiveTab('camera')}
                    className="bg-amber-500 text-slate-950 font-bold px-3 py-1 rounded-lg text-xs"
                  >
                    撮影へ
                  </button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="text-slate-400 block text-[11px] mb-1">工事名</label>
                    <input
                      type="text"
                      value={blackboard.projectName}
                      onChange={(e) => setBlackboard({ ...blackboard, projectName: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white outline-none"
                    />
                  </div>

                  <div className="space-y-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <div>
                      <label className="text-slate-400 block text-[11px] mb-1">工種</label>
                      <select
                        value={blackboard.workType29}
                        onChange={(e) => setBlackboard({ ...blackboard, workType29: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-800 text-white rounded-lg p-2 text-xs outline-none"
                      >
                        {CONSTRUCTION_29_TYPES.map((t) => (
                          <option key={t} value={t}>{t}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-400 block text-[11px] mb-1">作業種目</label>
                      <input
                        type="text"
                        placeholder="例: 舗装打換え工"
                        value={blackboard.workDetail}
                        onChange={(e) => setBlackboard({ ...blackboard, workDetail: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-white outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block text-[11px] mb-1">撮影部位</label>
                    <input
                      type="text"
                      placeholder="例: 西側歩道 A区画"
                      value={blackboard.location}
                      onChange={(e) => setBlackboard({ ...blackboard, location: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block text-[11px] mb-1">施工状況</label>
                    <div className="grid grid-cols-3 gap-1 mb-2">
                      {STAGE_OPTIONS.map(st => (
                        <button
                          key={st.id}
                          type="button"
                          onClick={() => setBlackboard({ ...blackboard, stage: st.id })}
                          className={`py-1.5 rounded-lg text-xs font-medium transition ${blackboard.stage === st.id ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-950 text-slate-300'}`}
                        >
                          {st.label}
                        </button>
                      ))}
                    </div>
                    <input
                      type="text"
                      placeholder="詳細状況 (例: 路盤整正・転圧中)"
                      value={blackboard.stageDetail}
                      onChange={(e) => setBlackboard({ ...blackboard, stageDetail: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-xs outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block text-[11px] mb-1">特記事項</label>
                    <textarea
                      rows={2}
                      placeholder="寸法・実測値・品質確認事項 (改行で2行表示)"
                      value={blackboard.specAndNotes}
                      onChange={(e) => setBlackboard({ ...blackboard, specAndNotes: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white resize-none text-xs leading-relaxed outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block text-[11px] mb-1">施工会社</label>
                    <input
                      type="text"
                      value={blackboard.constractor}
                      onChange={(e) => setBlackboard({ ...blackboard, constractor: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white outline-none"
                    />
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-800 space-y-3">
                  <span className="font-bold text-slate-300 block text-xs">表示設定</span>
                  
                  <div>
                    <label className="text-slate-400 block text-[11px] mb-1">配色</label>
                    <div className="grid grid-cols-3 gap-1 text-xs">
                      <button
                        type="button"
                        onClick={() => setBlackboard({ ...blackboard, theme: 'green' })}
                        className={`py-1.5 rounded-lg font-medium ${blackboard.theme === 'green' ? 'bg-emerald-700 text-white font-bold' : 'bg-slate-950 text-slate-400'}`}
                      >
                        グリーン
                      </button>
                      <button
                        type="button"
                        onClick={() => setBlackboard({ ...blackboard, theme: 'black' })}
                        className={`py-1.5 rounded-lg font-medium ${blackboard.theme === 'black' ? 'bg-slate-700 text-white font-bold' : 'bg-slate-950 text-slate-400'}`}
                      >
                        ブラック
                      </button>
                      <button
                        type="button"
                        onClick={() => setBlackboard({ ...blackboard, theme: 'white' })}
                        className={`py-1.5 rounded-lg font-medium ${blackboard.theme === 'white' ? 'bg-slate-200 text-slate-950 font-bold' : 'bg-slate-950 text-slate-400'}`}
                      >
                        ホワイト
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block text-[11px] mb-1">不透明度</label>
                    <div className="grid grid-cols-3 gap-1 text-xs">
                      <button
                        type="button"
                        onClick={() => setBlackboard({ ...blackboard, opacity: 0.50 })}
                        className={`py-1.5 rounded-lg transition ${blackboard.opacity === 0.50 ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-950 text-slate-400'}`}
                      >
                        50%
                      </button>
                      <button
                        type="button"
                        onClick={() => setBlackboard({ ...blackboard, opacity: 0.75 })}
                        className={`py-1.5 rounded-lg transition ${blackboard.opacity === 0.75 ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-950 text-slate-400'}`}
                      >
                        75%
                      </button>
                      <button
                        type="button"
                        onClick={() => setBlackboard({ ...blackboard, opacity: 1.00 })}
                        className={`py-1.5 rounded-lg transition ${blackboard.opacity === 1.00 ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-950 text-slate-400'}`}
                      >
                        100%
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-xs pt-1">
                    <div>
                      <label className="text-slate-400 block text-[11px] mb-1">位置</label>
                      <select
                        value={blackboard.position}
                        onChange={(e) => setBlackboard({ ...blackboard, position: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white outline-none"
                      >
                        <option value="bottom-right">右下</option>
                        <option value="bottom-left">左下</option>
                        <option value="top-right">右上</option>
                        <option value="top-left">左上</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-400 block text-[11px] mb-1">サイズ</label>
                      <select
                        value={blackboard.scale}
                        onChange={(e) => setBlackboard({ ...blackboard, scale: parseFloat(e.target.value) })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white outline-none"
                      >
                        <option value="0.38">小</option>
                        <option value="0.44">中</option>
                        <option value="0.50">大</option>
                      </select>
                    </div>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={() => setActiveTab('camera')}
                  className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl mt-2 text-xs transition"
                >
                  撮影を開始
                </button>
              </div>
            )}

            <div className={activeTab === 'camera' ? 'space-y-3' : 'hidden'}>
              <div className="flex items-center justify-between px-1 text-xs">
                <div className="flex items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
                  <button
                    type="button"
                    onClick={() => setPhotoOrientation('landscape')}
                    className={`px-3 py-1 rounded-lg transition text-xs ${photoOrientation === 'landscape' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}
                  >
                    横 (4:3)
                  </button>
                  <button
                    type="button"
                    onClick={() => setPhotoOrientation('portrait')}
                    className={`px-3 py-1 rounded-lg transition text-xs ${photoOrientation === 'portrait' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400'}`}
                  >
                    縦 (3:4)
                  </button>
                </div>

                <button
                  type="button"
                  onClick={handleToggleFacing}
                  className="px-3 py-1.5 rounded-xl text-xs bg-slate-900 text-slate-300 border border-slate-700"
                >
                  カメラ反転
                </button>
              </div>

              <div className={`relative bg-black rounded-2xl overflow-hidden border border-slate-800 w-full flex items-center justify-center shadow-xl transition-all ${photoOrientation === 'landscape' ? 'aspect-[4/3]' : 'aspect-[3/4]'}`}>
                <video
                  ref={videoRef}
                  playsInline
                  webkit-playsinline="true"
                  muted
                  autoPlay
                  className="absolute inset-0 w-full h-full object-cover hidden"
                />
                <canvas ref={canvasRef} className="w-full h-full object-contain pointer-events-none" />

                {isStreaming && (
                  <div className="absolute top-2 left-2 z-20 flex items-center gap-1.5 bg-slate-900/80 px-2 py-1 rounded-lg border border-slate-700 text-[10px] text-slate-300">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse" />
                    <span>黒板合成中</span>
                  </div>
                )}

                {!isStreaming && (
                  <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 p-4 text-center z-20 space-y-3">
                    {streamError ? (
                      <p className="text-xs text-rose-300">{streamError}</p>
                    ) : (
                      <p className="text-xs text-slate-400">カメラ準備中</p>
                    )}
                    <button
                      type="button"
                      onClick={() => startCamera(facingMode)}
                      className="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs"
                    >
                      カメラ起動
                    </button>
                  </div>
                )}
              </div>

              <div className="pt-2">
                <button
                  type="button"
                  disabled={isUploading}
                  onClick={handleShutter}
                  className="w-full bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-bold py-3.5 rounded-2xl text-base shadow-lg transition-all border border-amber-300 cursor-pointer"
                >
                  {isUploading ? "送信中..." : "撮影"}
                </button>
              </div>
            </div>

            {activeTab === 'history' && (
              <div className="space-y-3">
                <span className="text-xs font-bold text-slate-300 block">撮影履歴 ({recentPhotos.length})</span>
                {recentPhotos.length === 0 ? (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-500 text-xs">
                    撮影された写真はまだありません
                  </div>
                ) : (
                  <div className="grid grid-cols-2 gap-2">
                    {recentPhotos.map(p => (
                      <div key={p.id} className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden p-1">
                        <img src={p.url} alt="写真" className="w-full aspect-[4/3] object-cover rounded" />
                        <div className="p-1 text-[10px]">
                          <span className="text-amber-400 font-bold">{p.stage}</span>
                          <p className="text-slate-300 truncate">{p.workCategory}</p>
                          <p className="text-slate-500">{p.capturedAt}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<MobileCameraApp />, document.getElementById('root'));
  </script>
</body>
</html>
