  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>現場写真 電子黒板カメラ (29種工種対応・標準看板版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #020617;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">

  <div id="root">
    <div id="loading-fallback" class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
      <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-sm font-bold text-amber-400">現場カメラシステムを起動中...</p>
      <p class="text-xs text-slate-400 mt-2">画面が切り替わらない場合はブラウザを再読み込みしてください</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const CONSTRUCTION_TYPES_29 = [
      { id: '1', category: '一式工事', name: '土木一式工事', examples: ['道路改良工事', '宅地造成工事', '擁壁工事'] },
      { id: '2', category: '一式工事', name: '建築一式工事', examples: ['新築工事', '増改築工事', '耐震補強工事'] },
      { id: '3', category: '専門工事', name: '大工工事', examples: ['木工事', '床下地組', '造作工事', '型枠工事'] },
      { id: '4', category: '専門工事', name: '左官工事', examples: ['モルタル塗り', '外壁補修', '床コンクリート金コテ仕上げ'] },
      { id: '5', category: '専門工事', name: 'とび・土工・コンクリート工事', examples: ['仮設足場組立', '根切り工事', 'コンクリート打設', '地足場組立'] },

      { id: '8', category: '専門工事', name: '電気工事', examples: ['受変電設備工事', '幹線配線工事', '照明器具取付', '分電盤改修'] },
      { id: '9', category: '専門工事', name: '管工事', examples: ['冷暖房空調工事', '給排水衛生配管', 'ダクト設置', '消火配管工事'] },
      { id: '10', category: '専門工事', name: 'タイル・れんが・ブロック工事', examples: ['外壁タイル補修', 'ブロック積み工事', 'インターロッキング敷設'] },
      { id: '11', category: '専門工事', name: '鋼構造物工事', examples: ['鉄骨建方工事', '鋼製階段取付', '架台設置工事'] },
      { id: '12', category: '専門工事', name: '鉄筋工事', examples: ['基礎配筋工事', '柱梁配筋工事', '圧接作業'] },
      { id: '13', category: '専門工事', name: '舗装工事', examples: ['アスファルト舗装', '路盤整地', '歩道インターロッキング舗装'] },
      { id: '14', category: '専門工事', name: 'しゅんせつ工事', examples: ['港湾しゅんせつ', '河川堆積土除去'] },
      { id: '15', category: '専門工事', name: '板金工事', examples: ['建築板金工事', '水切り取付', '外壁金属サイディング'] },
      { id: '16', category: '専門工事', name: 'ガラス工事', examples: ['ガラスはめ込み工事', '複層ガラス交換'] },
      { id: '17', category: '専門工事', name: '塗装工事', examples: ['外壁塗装工事', '鉄部錆止め塗装', '防水塗装'] },
      { id: '18', category: '専門工事', name: '防水工事', examples: ['屋上ウレタン防水', 'シーリング工事', 'シート防水', 'アスファルト防水'] },
      { id: '19', category: '専門工事', name: '内装仕上工事', examples: ['LGS軽鉄下地組', 'プラスターボード貼り', 'クロス貼り', '床長尺シート貼り'] },
      { id: '20', category: '専門工事', name: '機械器具設置工事', examples: ['エレベーター設置', '立体駐車場設備据付', '空調機器搬入据付'] },
      { id: '21', category: '専門工事', name: '熱絶縁工事', examples: ['配管保温工事', 'ダクト保冷工事', 'グラスウール巻込み'] },
      { id: '22', category: '専門工事', name: '電気通信工事', examples: ['LAN配線工事', '防犯カメラ設置', 'インターホン設備', '放送設備'] },
      { id: '23', category: '専門工事', name: '造園工事', examples: ['植栽工事', '芝貼り工事', '景石配置', '剪定・伐採'] },
      { id: '24', category: '専門工事', name: 'さく井工事', examples: ['井戸掘削工事', '観測井設置', '消雪用井戸工事'] },
      { id: '25', category: '専門工事', name: '建具工事', examples: ['アルミサッシ取付', 'スチールドア取付', 'シャッター工事'] },
      { id: '26', category: '専門工事', name: '水道施設工事', examples: ['配水管布設工事', '配水池築造', '水道本管更新'] },
      { id: '27', category: '専門工事', name: '消防施設工事', examples: ['スプリンクラー設置', '消火栓配管', '自動火災報知設備'] },
      { id: '28', category: '専門工事', name: '清掃施設工事', examples: ['ごみ焼却施設工事', '汚泥再生処理センター工事'] },
      { id: '29', category: '専門工事', name: '解体工事', examples: ['内装解体工事', '木造解体工事', 'RC解体工事', 'アスベスト除去'] }
    ];

    const STAGE_OPTIONS = [
      { id: '施工前', label: '施工前', color: '#1d4ed8' },
      { id: '施工中', label: '施工中', color: '#b45309' },
      { id: '施工完了', label: '施工完了', color: '#047857' },
      { id: '材料・機材', label: '材料・機材', color: '#6d28d9' },
      { id: '産業廃棄物', label: '産業廃棄物', color: '#be123c' },
    ];

    function MobileCameraApp() {
      const [activeTab, setActiveTab] = useState('camera');
      const [isStreaming, setIsStreaming] = useState(false);
      const [streamError, setStreamError] = useState(null);
      const [facingMode, setFacingMode] = useState('environment');
      const [isUploading, setIsUploading] = useState(false);
      const [uploadSuccessAlert, setUploadSuccessAlert] = useState(null);

      const [photoOrientation, setPhotoOrientation] = useState('landscape');

      const [urlConfig, setUrlConfig] = useState({
        gasUrl: '',
        recordId: '',
        projectCode: '',
        projectName: '',
        constractor: '',
        location: '',
        manager: ''
      });

      const [blackboard, setBlackboard] = useState({
        projectName: '整備・工事記録写真',
        selectedIndustry: '舗装工事',
        workDetail: 'インターロッキングブロック敷設',
        location: '1F エントランス前 西側歩道',
        stage: '施工中',
        stageDetail: 'ブロック敷設・目地詰め',
        spec: '不陸: L=3.5m, 段差=25mm',
        constractor: '',
        date: new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '-'),
        notes: '',
        scale: 0.44,
        opacity: 0.96,
        position: 'bottom-right'
      });

      const [recentPhotos, setRecentPhotos] = useState(() => {
        try {
          const s = localStorage.getItem('GH_PHOTO_HISTORY_V3');
          if (s) return JSON.parse(s);
        } catch (e) {}
        return [];
      });

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const animFrameRef = useRef(null);

      useEffect(() => {
        const p = new URLSearchParams(window.location.search);
        let gasUrl = p.get('gasUrl') || '';
        if (gasUrl.includes('%')) {
          try { gasUrl = decodeURIComponent(gasUrl); } catch(e){}
        }
        const recordId = p.get('recordId') || '';
        const projectCode = p.get('projectCode') || '';
        const projectName = p.get('projectName') || '';
        const constractor = p.get('constractor') || p.get('contractor') || '';
        const location = p.get('location') || '';
        const manager = p.get('manager') || '';

        setUrlConfig({ gasUrl, recordId, projectCode, projectName, constractor, location, manager });

        setBlackboard(prev => ({
          ...prev,
          projectName: projectName || prev.projectName,
          constractor: constractor || prev.constractor,
          location: location || prev.location
        }));
      }, []);

      const startCamera = async (targetFacing = facingMode) => {
        setStreamError(null);

        if (streamRef.current) {
          try {
            streamRef.current.getTracks().forEach(t => t.stop());
          } catch(e) {}
          streamRef.current = null;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStreamError('ブラウザがカメラ機能に対応していません。');
          return;
        }

        const tryConstraints = [
          { video: { facingMode: targetFacing, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false },
          { video: { facingMode: targetFacing }, audio: false },
          { video: { facingMode: { ideal: targetFacing } }, audio: false },
          { video: true, audio: false }
        ];

        let activeStream = null;
        for (const constraints of tryConstraints) {
          try {
            activeStream = await navigator.mediaDevices.getUserMedia(constraints);
            if (activeStream) break;
          } catch (err) {
            console.warn('カメラ試行スキップ:', err);
          }
        }

        if (!activeStream) {
          setStreamError('カメラの起動に失敗しました。カメラの利用許可を確認してください。');
          setIsStreaming(false);
          return;
        }

        streamRef.current = activeStream;
        const video = videoRef.current;
        if (video) {
          video.srcObject = activeStream;
          video.setAttribute('playsinline', 'true');
          video.setAttribute('webkit-playsinline', 'true');
          video.setAttribute('muted', 'true');
          video.muted = true;
          try {
            await video.play();
            setIsStreaming(true);
            setStreamError(null);
          } catch (e) {
            console.warn('playエラー強制復元:', e);
            setIsStreaming(true);
          }
        }
      };

      useEffect(() => {
        startCamera(facingMode);
        return () => {
          if (streamRef.current) {
            streamRef.current.getTracks().forEach(t => t.stop());
          }
        };
      }, [facingMode]);

      useEffect(() => {
        if (activeTab === 'camera') {
          const video = videoRef.current;
          if (video && streamRef.current) {
            if (video.srcObject !== streamRef.current) {
              video.srcObject = streamRef.current;
            }
            video.play().catch(() => {});
          }
        }
      }, [activeTab]);

      const handleToggleFacing = () => {
        const next = facingMode === 'environment' ? 'user' : 'environment';
        setFacingMode(next);
        startCamera(next);
      };

      const drawFittedText = (ctx, text, x, y, maxWidth, baseFontSize, color, align = 'left', isBold = true) => {
        if (!text) return;
        ctx.save();
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        let fontSize = baseFontSize;
        ctx.font = `${isBold ? 'bold' : 'normal'} ${fontSize}px sans-serif`;
        while (ctx.measureText(text).width > maxWidth && fontSize > 8) {
          fontSize -= 0.5;
          ctx.font = `${isBold ? 'bold' : 'normal'} ${fontSize}px sans-serif`;
        }
        let txt = text;
        if (ctx.measureText(txt).width > maxWidth) {
          while (txt.length > 1 && ctx.measureText(txt + '…').width > maxWidth) {
            txt = txt.slice(0, -1);
          }
          txt += '…';
        }
        ctx.fillText(txt, x, y);
        ctx.restore();
      };

      // 電子黒板描画（区切り線なし・見出しなしのすっきり版）
      const renderBlackboard = useCallback((ctx, w, h) => {
        const boardW = Math.round(w * blackboard.scale);
        const boardH = Math.round(boardW * 0.72);
        const margin = 16;

        let bx = w - boardW - margin;
        let by = h - boardH - margin;
        if (blackboard.position === 'bottom-left') { bx = margin; by = h - boardH - margin; }
        else if (blackboard.position === 'top-right') { bx = w - boardW - margin; by = margin; }
        else if (blackboard.position === 'top-left') { bx = margin; by = margin; }

        ctx.save();
        ctx.globalAlpha = blackboard.opacity;

        const borderThickness = 6;
        ctx.fillStyle = '#2b1810';
        ctx.fillRect(bx, by, boardW, boardH);
        ctx.fillStyle = '#5c3317';
        ctx.fillRect(bx + 1, by + 1, boardW - 2, 2);
        ctx.fillRect(bx + 1, by + 1, 2, boardH - 2);

        const innerX = bx + borderThickness;
        const innerY = by + borderThickness;
        const innerW = boardW - borderThickness * 2;
        const innerH = boardH - borderThickness * 2;

        ctx.fillStyle = '#0f3822';
        ctx.fillRect(innerX, innerY, innerW, innerH);

        const h1 = innerH * 0.16;
        const h2 = innerH * 0.16;
        const h3 = innerH * 0.17;
        const h4 = innerH * 0.18;
        const h5 = innerH * 0.17;
        const h6 = innerH * 0.16;

        const y1 = innerY;
        const y2 = y1 + h1;
        const y3 = y2 + h2;
        const y4 = y3 + h3;
        const y5 = y4 + h4;
        const y6 = y5 + h5;

        const labelColW = Math.round(innerW * 0.22);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 1;

        // 工事名・工種のみの罫線
        ctx.beginPath();
        ctx.moveTo(innerX, y2);
        ctx.lineTo(innerX + innerW, y2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(innerX, y3);
        ctx.lineTo(innerX + innerW, y3);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(innerX + labelColW, y1);
        ctx.lineTo(innerX + labelColW, y3);
        ctx.stroke();

        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.fillRect(innerX, y1, labelColW, h1 + h2);

        // 【上段】工事名
        drawFittedText(ctx, '工事名', innerX + labelColW / 2, y1 + h1 / 2, labelColW - 6, Math.round(h1 * 0.42), '#f8fafc', 'center', true);
        drawFittedText(ctx, blackboard.projectName || '未設定', innerX + labelColW + 10, y1 + h1 / 2, innerW - labelColW - 16, Math.round(h1 * 0.46), '#fef08a', 'left', true);

        // 【2段目】工種
        drawFittedText(ctx, '工　種', innerX + labelColW / 2, y2 + h2 / 2, labelColW - 6, Math.round(h2 * 0.42), '#f8fafc', 'center', true);
        const fullWorkCategory = `${blackboard.selectedIndustry || '一般工事'}${blackboard.workDetail ? ' / ' + blackboard.workDetail : ''}`;
        drawFittedText(ctx, fullWorkCategory, innerX + labelColW + 10, y2 + h2 / 2, innerW - labelColW - 16, Math.round(h2 * 0.44), '#ffffff', 'left', true);

        // 【中段①】撮影場所 (測点)
        const locLabel = '撮影場所 (測点)：';
        ctx.font = `bold ${Math.round(h3 * 0.36)}px sans-serif`;
        const locLabelWidth = ctx.measureText(locLabel).width;
        drawFittedText(ctx, locLabel, innerX + 10, y3 + h3 / 2, locLabelWidth, Math.round(h3 * 0.36), '#cbd5e1', 'left', true);
        drawFittedText(ctx, blackboard.location || '-', innerX + 10 + locLabelWidth + 4, y3 + h3 / 2, innerW - locLabelWidth - 20, Math.round(h3 * 0.40), '#ffffff', 'left', false);

        // 【中段②】施工状況 (内容)
        const stageLabel = '施工状況 (内容)：';
        ctx.font = `bold ${Math.round(h4 * 0.36)}px sans-serif`;
        const stageLabelWidth = ctx.measureText(stageLabel).width;
        drawFittedText(ctx, stageLabel, innerX + 10, y4 + h4 / 2, stageLabelWidth, Math.round(h4 * 0.36), '#cbd5e1', 'left', true);

        const curStage = STAGE_OPTIONS.find(s => s.id === blackboard.stage) || STAGE_OPTIONS[1];
        const badgeText = curStage.label;
        const badgeW = Math.max(50, Math.round(ctx.measureText(badgeText).width + 16));
        const badgeH = Math.round(h4 * 0.65);
        const badgeX = innerX + 10 + stageLabelWidth + 4;
        const badgeY = y4 + (h4 - badgeH) / 2;

        ctx.fillStyle = curStage.color;
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 4);
          ctx.fill();
        } else {
          ctx.fillRect(badgeX, badgeY, badgeW, badgeH);
        }
        drawFittedText(ctx, badgeText, badgeX + badgeW / 2, y4 + h4 / 2, badgeW - 6, Math.round(h4 * 0.38), '#ffffff', 'center', true);

        if (blackboard.stageDetail) {
          const detailStartX = badgeX + badgeW + 8;
          drawFittedText(ctx, blackboard.stageDetail, detailStartX, y4 + h4 / 2, innerW - (detailStartX - innerX) - 10, Math.round(h4 * 0.38), '#fef08a', 'left', false);
        }

        // 【中段③】寸法・規格
        const specLabel = '寸法・規格：';
        ctx.font = `bold ${Math.round(h5 * 0.36)}px sans-serif`;
        const specLabelWidth = ctx.measureText(specLabel).width;
        drawFittedText(ctx, specLabel, innerX + 10, y5 + h5 / 2, specLabelWidth, Math.round(h5 * 0.36), '#cbd5e1', 'left', true);
        drawFittedText(ctx, blackboard.spec || '設計値・実測値どおり良好', innerX + 10 + specLabelWidth + 4, y5 + h5 / 2, innerW - specLabelWidth - 20, Math.round(h5 * 0.40), '#fef9c3', 'left', false);

        // 【下段】施工会社名 ＆ 撮影日（見出しラベルなし）
        const constractorText = blackboard.constractor || '施工者名未設定';
        drawFittedText(ctx, constractorText, innerX + 10, y6 + h6 / 2, Math.round(innerW * 0.58), Math.round(h6 * 0.44), '#6ee7b7', 'left', true);

        const dateText = blackboard.date || '-';
        drawFittedText(ctx, dateText, innerX + innerW - 10, y6 + h6 / 2, Math.round(innerW * 0.38), Math.round(h6 * 0.44), '#93c5fd', 'right', true);

        ctx.restore();
      }, [blackboard]);

      useEffect(() => {
        const renderLoop = () => {
          const canvas = canvasRef.current;
          const video = videoRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const isLandscape = (photoOrientation === 'landscape');
          const canvasW = isLandscape ? 1200 : 900;
          const canvasH = isLandscape ? 900 : 1200;

          if (canvas.width !== canvasW) canvas.width = canvasW;
          if (canvas.height !== canvasH) canvas.height = canvasH;

          ctx.clearRect(0, 0, canvasW, canvasH);

          const isVideoActive = !!(video && video.srcObject && video.videoWidth > 0 && video.videoHeight > 0);

          if (isVideoActive) {
            const vw = video.videoWidth;
            const vh = video.videoHeight;

            const videoRatio = vw / vh;
            const canvasRatio = canvasW / canvasH;

            let sx, sy, sWidth, sHeight;
            if (videoRatio > canvasRatio) {
              sHeight = vh;
              sWidth = vh * canvasRatio;
              sx = (vw - sWidth) / 2;
              sy = 0;
            } else {
              sWidth = vw;
              sHeight = vw / canvasRatio;
              sx = 0;
              sy = (vh - sHeight) / 2;
            }

            try {
              if (facingMode === 'user') {
                ctx.save();
                ctx.translate(canvasW, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvasW, canvasH);
                ctx.restore();
              } else {
                ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvasW, canvasH);
              }
            } catch(e) {}
          } else {
            const grad = ctx.createLinearGradient(0, 0, canvasW, canvasH);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#020617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvasW, canvasH);
          }

          renderBlackboard(ctx, canvasW, canvasH);
          animFrameRef.current = requestAnimationFrame(renderLoop);
        };

        animFrameRef.current = requestAnimationFrame(renderLoop);
        return () => {
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        };
      }, [isStreaming, facingMode, photoOrientation, renderBlackboard]);

      const handleShutter = async () => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        const fullWorkCategory = `${blackboard.selectedIndustry || '一般工事'}${blackboard.workDetail ? ' / ' + blackboard.workDetail : ''}`;

        const photoRecord = {
          id: 'photo_' + Date.now(),
          url: dataUrl,
          stage: blackboard.stage,
          workCategory: fullWorkCategory,
          location: blackboard.location,
          capturedAt: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
        };

        const updated = [photoRecord, ...recentPhotos];
        setRecentPhotos(updated);
        try {
          localStorage.setItem('GH_PHOTO_HISTORY_V3', JSON.stringify(updated));
        } catch(e) {}

        if (urlConfig.gasUrl) {
          setIsUploading(true);
          try {
            const payload = {
              action: "uploadCapturedPhoto",
              recordId: urlConfig.recordId,
              photoData: {
                photoNo: Date.now(),
                projectCode: urlConfig.projectCode,
                base64Image: dataUrl,
                title: `No. ${blackboard.stage} - ${fullWorkCategory}`,
                stage: blackboard.stage,
                projectName: blackboard.projectName,
                workCategory: fullWorkCategory,
                location: blackboard.location,
                spec: blackboard.spec,
                date: blackboard.date,
                constractor: blackboard.constractor,
                notes: [blackboard.stageDetail, blackboard.notes].filter(Boolean).join(' / ') || '-'
              }
            };

            await fetch(urlConfig.gasUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify(payload),
              mode: 'no-cors'
            });

            setIsUploading(false);
            setUploadSuccessAlert('✅ 撮影完了！黒板付き写真と作業情報をkintoneサブテーブルへ送信しました');
            setTimeout(() => setUploadSuccessAlert(null), 4000);
          } catch(err) {
            console.error(err);
            setIsUploading(false);
            alert('送信に失敗しました: ' + err.message);
          }
        } else {
          setUploadSuccessAlert('✅ 撮影完了！（端末に保存しました・kintone未接続モード）');
          setTimeout(() => setUploadSuccessAlert(null), 3000);
        }
      };

      const currentIndustryObj = CONSTRUCTION_TYPES_29.find(c => c.name === blackboard.selectedIndustry) || CONSTRUCTION_TYPES_29[12];

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col justify-between pb-6">
          <header className="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-3.5 py-2.5 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className={`w-2.5 h-2.5 rounded-full ${isStreaming ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
              <span className="text-xs font-black text-white tracking-wide">現場写真 電子黒板カメラ</span>
            </div>
            <span className="text-[10px] font-mono font-bold bg-amber-950/80 text-amber-300 px-2 py-0.5 rounded border border-amber-800/80">
              {urlConfig.projectCode ? `[${urlConfig.projectCode}]` : '現場モード'}
            </span>
          </header>

          <div className="bg-slate-900/80 border-b border-slate-800 px-2 py-1.5 flex items-center justify-around text-xs font-bold">
            <button
              onClick={() => setActiveTab('camera')}
              className={`flex-1 py-1.5 text-center rounded-lg transition ${activeTab === 'camera' ? 'bg-amber-500 text-slate-950 font-black shadow' : 'text-slate-400'}`}
            >
              📷 撮影
            </button>
            <button
              onClick={() => setActiveTab('board')}
              className={`flex-1 py-1.5 text-center rounded-lg transition ${activeTab === 'board' ? 'bg-amber-500 text-slate-950 font-black shadow' : 'text-slate-400'}`}
            >
              📋 看板設定 (29種工種)
            </button>
            <button
              onClick={() => setActiveTab('history')}
              className={`flex-1 py-1.5 text-center rounded-lg transition ${activeTab === 'history' ? 'bg-amber-500 text-slate-950 font-black shadow' : 'text-slate-400'}`}
            >
              🖼️ 撮影済み ({recentPhotos.length})
            </button>
          </div>

          {uploadSuccessAlert && (
            <div className="mx-3 mt-2 bg-emerald-950/95 border border-emerald-500 text-emerald-200 text-xs p-2.5 rounded-xl shadow-lg">
              {uploadSuccessAlert}
            </div>
          )}

          <main className="flex-1 p-3 space-y-3">
            <div className={activeTab === 'camera' ? 'space-y-3' : 'hidden'}>
              <div className="flex items-center justify-between px-1 text-xs">
                <div className="flex items-center gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800">
                  <button
                    type="button"
                    onClick={() => setPhotoOrientation('landscape')}
                    className={`px-2.5 py-1 rounded-lg font-bold transition text-[11px] ${photoOrientation === 'landscape' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400'}`}
                  >
                    横写真 (4:3)
                  </button>
                  <button
                    type="button"
                    onClick={() => setPhotoOrientation('portrait')}
                    className={`px-2.5 py-1 rounded-lg font-bold transition text-[11px] ${photoOrientation === 'portrait' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400'}`}
                  >
                    縦写真 (3:4)
                  </button>
                </div>

                {isStreaming && (
                  <button
                    type="button"
                    onClick={handleToggleFacing}
                    className="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-slate-900 text-slate-200 border border-slate-700 shadow"
                  >
                    🔄 カメラ反転
                  </button>
                )}
              </div>

              <div className={`relative bg-black rounded-2xl overflow-hidden border-2 border-slate-800 w-full flex items-center justify-center shadow-2xl transition-all ${photoOrientation === 'landscape' ? 'aspect-[4/3]' : 'aspect-[3/4]'}`}>
                <video
                  ref={videoRef}
                  playsInline
                  webkit-playsinline="true"
                  muted
                  autoPlay
                  className="absolute inset-0 w-full h-full object-cover hidden"
                />
                <canvas ref={canvasRef} className="w-full h-full object-contain pointer-events-none" />

                {isStreaming && (
                  <div className="absolute top-2 left-2 z-20 flex items-center gap-1.5 bg-slate-900/85 px-2.5 py-1 rounded-lg border border-emerald-500/60 shadow">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                    <span className="text-[10px] text-emerald-300 font-bold">🟢 新基準看板 合成中</span>
                  </div>
                )}

                {!isStreaming && (
                  <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/85 p-4 text-center z-20 space-y-3">
                    {streamError ? (
                      <p className="text-xs text-rose-300">{streamError}</p>
                    ) : (
                      <p className="text-xs text-amber-300 font-bold">カメラ起動中...</p>
                    )}
                    <button
                      type="button"
                      onClick={() => startCamera(facingMode)}
                      className="bg-amber-500 text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs"
                    >
                      📷 カメラを起動する
                    </button>
                  </div>
                )}
              </div>

              <div className="pt-2">
                <button
                  type="button"
                  disabled={isUploading}
                  onClick={handleShutter}
                  className="w-full bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 hover:from-amber-400 active:scale-95 text-slate-950 font-black py-4 rounded-2xl text-lg flex items-center justify-center gap-2 shadow-2xl shadow-amber-500/30 transition-all cursor-pointer border-2 border-amber-300"
                >
                  {isUploading ? (
                    <span>⏳ kintoneへ送信中...</span>
                  ) : (
                    <>
                      <span className="text-2xl">📸</span>
                      <span>シャッターを切る (kintone保存)</span>
                    </>
                  )}
                </button>
                <div className="flex items-center justify-between text-[10px] text-slate-400 mt-1.5 px-1">
                  <span>工種: {blackboard.selectedIndustry}</span>
                  <span>状況: {blackboard.stage}</span>
                </div>
              </div>
            </div>

            {activeTab === 'board' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3.5 text-xs max-h-[80vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <span className="font-bold text-amber-400 text-sm">📋 写真看板 設定</span>
                  <span className="text-[10px] text-slate-400">撮影手順書準拠</span>
                </div>

                <div>
                  <label className="text-slate-300 font-bold block text-[11px] mb-1">工事名（ステップ①名称）</label>
                  <input
                    type="text"
                    value={blackboard.projectName}
                    onChange={(e) => setBlackboard({ ...blackboard, projectName: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white font-medium"
                    placeholder="例: ○○ビル 舗装改修工事"
                  />
                </div>

                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2.5">
                  <span className="text-amber-300 font-bold block text-[11px]">
                    工種（建設業29種 ＋ 工事内容）
                  </span>

                  <div>
                    <label className="text-slate-400 block text-[10px] mb-0.5">建設業29種（選択）</label>
                    <select
                      value={blackboard.selectedIndustry}
                      onChange={(e) => {
                        const newInd = e.target.value;
                        const found = CONSTRUCTION_TYPES_29.find(c => c.name === newInd);
                        setBlackboard({
                          ...blackboard,
                          selectedIndustry: newInd,
                          workDetail: found && found.examples ? found.examples[0] : blackboard.workDetail
                        });
                      }}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-amber-300 font-bold outline-none cursor-pointer"
                    >
                      <optgroup label="【一式工事】">
                        {CONSTRUCTION_TYPES_29.filter(c => c.category === '一式工事').map(c => (
                          <option key={c.id} value={c.name}>{c.id}. {c.name}</option>
                        ))}
                      </optgroup>
                      <optgroup label="【専門工事】">
                        {CONSTRUCTION_TYPES_29.filter(c => c.category === '専門工事').map(c => (
                          <option key={c.id} value={c.name}>{c.id}. {c.name}</option>
                        ))}
                      </optgroup>
                    </select>
                  </div>

                  <div>
                    <label className="text-slate-400 block text-[10px] mb-1">工事内容（代表例からクイック選択）</label>
                    <div className="flex flex-wrap gap-1 mb-1.5">
                      {currentIndustryObj && currentIndustryObj.examples.map(ex => (
                        <button
                          key={ex}
                          type="button"
                          onClick={() => setBlackboard({ ...blackboard, workDetail: ex })}
                          className={`px-2 py-0.5 rounded text-[10px] font-bold transition border ${blackboard.workDetail === ex ? 'bg-amber-500 text-slate-950 border-amber-400' : 'bg-slate-900 text-slate-300 border-slate-700'}`}
                        >
                          {ex}
                        </button>
                      ))}
                    </div>
                    <label className="text-slate-400 block text-[10px] mb-0.5">工事内容（自由記載・微修正）</label>
                    <input
                      type="text"
                      value={blackboard.workDetail}
                      onChange={(e) => setBlackboard({ ...blackboard, workDetail: e.target.value })}
                      placeholder="例: 配線工事 / インターロッキング修繕"
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"
                    />
                  </div>

                  <div className="text-[10px] text-emerald-400 bg-emerald-950/50 p-1.5 rounded border border-emerald-900">
                    看板表示プレビュー: <span className="font-bold text-white">{blackboard.selectedIndustry} / {blackboard.workDetail || '(内容未入力)'}</span>
                  </div>
                </div>

                <div>
                  <label className="text-slate-300 font-bold block text-[11px] mb-1">撮影場所 (測点)</label>
                  <input
                    type="text"
                    value={blackboard.location}
                    onChange={(e) => setBlackboard({ ...blackboard, location: e.target.value })}
                    placeholder="例: 1F エントランス前 西側歩道"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white"
                  />
                </div>

                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                  <label className="text-amber-300 font-bold block text-[11px]">施工状況 (内容)</label>
                  <div className="grid grid-cols-3 gap-1">
                    {STAGE_OPTIONS.map(st => (
                      <button
                        key={st.id}
                        type="button"
                        onClick={() => setBlackboard({ ...blackboard, stage: st.id })}
                        className={`py-1.5 rounded font-bold transition text-[11px] ${blackboard.stage === st.id ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-300'}`}
                      >
                        {st.id}
                      </button>
                    ))}
                  </div>

                  <div>
                    <label className="text-slate-400 block text-[10px] mb-0.5">現場の具体的な状態</label>
                    <input
                      type="text"
                      value={blackboard.stageDetail}
                      onChange={(e) => setBlackboard({ ...blackboard, stageDetail: e.target.value })}
                      placeholder="例: ブロック仮撤去完了、砂埋め戻し"
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-slate-300 font-bold block text-[11px] mb-1">寸法・規格</label>
                  <input
                    type="text"
                    value={blackboard.spec}
                    onChange={(e) => setBlackboard({ ...blackboard, spec: e.target.value })}
                    placeholder="例: 不陸: L=3.5m, 段差=25mm"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-slate-300 font-bold block text-[11px] mb-1">施工者名</label>
                    <input
                      type="text"
                      value={blackboard.constractor}
                      onChange={(e) => setBlackboard({ ...blackboard, constractor: e.target.value })}
                      placeholder="会社名"
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-[11px]"
                    />
                  </div>
                  <div>
                    <label className="text-slate-300 font-bold block text-[11px] mb-1">撮影日</label>
                    <input
                      type="date"
                      value={blackboard.date}
                      onChange={(e) => setBlackboard({ ...blackboard, date: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-[11px]"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-slate-400 block text-[10px] mb-0.5">特記事項（任意）</label>
                  <input
                    type="text"
                    value={blackboard.notes}
                    onChange={(e) => setBlackboard({ ...blackboard, notes: e.target.value })}
                    placeholder="例: ※舗装下部に空洞あり"
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white"
                  />
                </div>

                <button
                  type="button"
                  onClick={() => setActiveTab('camera')}
                  className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl mt-3 text-sm shadow cursor-pointer"
                >
                  この設定で撮影する ➔
                </button>
              </div>
            )}

            {activeTab === 'history' && (
              <div className="space-y-3">
                <span className="text-xs font-bold text-white block">撮影済み写真 ({recentPhotos.length}枚)</span>
                <div className="grid grid-cols-2 gap-2">
                  {recentPhotos.map(p => (
                    <div key={p.id} className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden p-1.5">
                      <img src={p.url} alt="写真" className="w-full aspect-[4/3] object-cover rounded" />
                      <div className="p-1 text-[10px] space-y-0.5">
                        <span className="bg-amber-500 text-slate-950 font-black px-1.5 py-0.2 rounded text-[9px]">
                          {p.stage}
                        </span>
                        <p className="text-white font-bold truncate">{p.workCategory}</p>
                        <p className="text-slate-400 truncate">{p.location}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<MobileCameraApp />, document.getElementById('root'));
  </script>
</body>
</html>
